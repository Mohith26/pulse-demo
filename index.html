}

];
const INELIGIBLE = /shoe|sneaker|clothes|clothing|apparel|legging|chair|desk|mattress|pillow|tv|laptop|phone|bike|bicycle|alcohol|wine|beer|grocer|uber|lyft|travel|flight|hotel|gift card/;

      </div>
    </div></div>, document.body);
}

const stripHtml = h => (h || '').replace(/<[^>]+>/g, '').replace(/&nbsp;/g, ' ');

  const stop = () => { ref.current && ref.current.stop(); setL(false); };
  return { supported: !!Rec, listening, start, stop };
}
function SpeakButton({ text, prefs, label = 'Play your brief', className, light }) {
  const speaking = useSpeaking(); const toast = useToast(); const ok = 'speechSynthesis' in window;
  if (!ok) return null;
  return <button onClick={() => { if (speaking) stopSpeaking(); else if (!speak(text, prefs)) toast('Voice is not available in this browser', 'error'); }} className={cx('inline-flex items-center gap-2 h-9 pl-2 pr-4 rounded-full text-[13px] font-medium transition focus-ring', light ? 'glass text-white hover:bg-white/25' : 'bg-bg2 text-ink hover:bg-line', className)} aria-label={speaking ? 'Stop' : label}>
    <span className={cx('w-6 h-6 rounded-full flex items-center justify-center', light ? 'bg-white text-[#1d2a36]' : 'bg-ink text-bg')} style={light ? {} : { background: 'var(--btn)', color: 'var(--btn-ink)' }}>{speaking ? I.pause(10) : I.play(10)}</span>{speaking ? 'Stop' : label}</button>;
}

/* ─── ONBOARDING (personalized) ─── */
function EmployeeOnboarding({ user, company, employee }) {
  const [step, setStep] = useState(0); const [focus, setFocus] = useState(['sleep', 'stress']); const [tone, setTone] = useState('coach'); const [device, setDevice] = useState(null); const enabled = company.incentives.goals.filter(g => g.enabled).map(g => g.id); const [goals, setGoals] = useState(enabled); const [plan, setPlan] = useState('silver'); const [types, setTypes] = useState({ sleep: true, hrv: true, activity: true, heart: true }); const [agree, setAgree] = useState(false);
  const steps = ['Welcome', 'Focus', 'Voice', 'Device', 'Consent', 'Goals', 'Plan'];
  const finish = () => { db.update('users', user.id, { prefs: { ...userPrefs(user), focus, tone } }); const fresh = db.find('employees', e => e.id === employee.id); db.update('employees', employee.id, { onboarded: true, deviceId: device || fresh.deviceId || null, deviceConnectedAt: device || fresh.deviceId ? iso(today()) : null, goals, planId: plan, permissions: types, consent: { version: '2026-10', at: iso(today()), types } }); audit(company.id, employee.name, 'Signed data consent', employee.id, 'version 2026-10'); if (device) db.log('device_connected', company.id, { name: employee.name, device: deviceById(device).name }); db.log('employee_onboarded', company.id, { name: employee.name }); fireConfetti(); navigate('/me'); };
  const next = () => step < steps.length - 1 ? setStep(step + 1) : finish();
  const body = [

    <><h1 className="serif text-[40px] leading-tight text-ink">Choose your plan</h1><p className="text-[15px] text-ink2 mt-2">{company.name} contributes {fmtMoney(company.plan.ichraMonthly)}/month. The plan is yours and goes with you.</p><div className="space-y-2.5 mt-6">{PLANS.map(p => <button key={p.id} onClick={() => setPlan(p.id)} aria-pressed={plan === p.id} className="w-full text-left p-4 rounded-2xl border-[1.5px] transition focus-ring flex items-center gap-4" style={{ borderColor: plan === p.id ? 'var(--ink)' : 'var(--line)', background: plan === p.id ? 'var(--surface)' : 'transparent' }}><div className="flex-1"><div className="text-[15px] text-ink">{p.name} <span className="text-[12px] text-ink3 ml-1">{p.tag}</span></div><div className="text-[12.5px] text-ink3">{p.carrier} · {fmtMoney(p.deductible)} deductible</div></div><div className="text-right"><div className="tabular text-[16px] text-ink">{fmtMoney(Math.max(0, p.premium - company.plan.ichraMonthly))}</div><div className="text-[11px] text-ink3">you pay /mo</div><div className="text-[11px]" style={{ color: 'var(--good)' }}>+ up to {fmtMoney(company.incentives.monthlyCap)} rewards</div></div></button>)}</div></>,
  ][step];
  useEffect(() => { const k = e => { if (e.key === 'Enter' && document.activeElement.tagName !== 'TEXTAREA' && !((step === 1 && !focus.length) || (step === 3 && !device) || (step === 4 && !agree))) { e.preventDefault(); next(); } }; window.addEventListener('keydown', k); return () => window.removeEventListener('keydown', k); });
  return <div className="min-h-screen bg-bg flex flex-col"><header className="max-w-2xl w-full mx-auto px-6 h-20 flex items-center justify-between"><Logo /><div className="flex items-center gap-3"><span className="label">Step {String(step + 1).padStart(2, '0')} · {steps[step]}</span></div></header><div className="max-w-2xl w-full mx-auto px-6"><div className="flex gap-1.5">{steps.map((_, i) => <div key={i} className="flex-1 h-1 rounded-full transition-all" style={{ background: i <= step ? 'var(--accent)' : 'var(--line)' }} />)}</div></div>
    <main className="flex-1 max-w-2xl w-full mx-auto px-6 py-10 fade-in" key={step}>{body}</main>

}

          <div className="flex items-center justify-between p-4 rounded-[18px] bg-surface" style={{ boxShadow: '0 0 0 1px var(--line)' }}><div><div className="text-[14.5px] font-semibold text-ink">Regular prescriptions?</div><div className="text-[12.5px] text-ink3">Pulse checks each plan’s formulary</div></div><Toggle on={rx} onChange={setRx} label="Regular prescriptions" /></div></div>
        : step === 2 ? <div className="space-y-3">{waive ? <div className="stagger space-y-3"><p className="text-[14px] text-ink2">You can waive if you have other coverage. ICHRA requires individual coverage to be reimbursed.</p>{['Covered by spouse’s plan', 'Covered by a parent’s plan (under 26)', 'Medicare', 'Medicaid', 'Other coverage'].map(r => <button key={r} onClick={() => setWhy(r)} className="w-full p-4 rounded-[18px] bg-surface text-left text-[14.5px] font-medium text-ink press" style={{ boxShadow: why === r ? '0 0 0 2px var(--ink)' : '0 0 0 1px var(--line)' }}>{r}</button>)}<button className="text-[13px] font-semibold text-ink3 hover:text-ink" onClick={() => setWaive(false)}>Back to plans</button></div> : <>
          <p className="text-[13.5px] text-ink2">Sorted by what you’d likely spend in a year (premium after allowance plus expected care){doctor ? `, and whether it keeps ${doctor.name}` : ''}.</p>
          {quotes.map(({ p, q, keeps }, i) => { const on = pick === p.id; return <button key={p.id} onClick={() => setMed(p.id)} className="w-full text-left p-4 rounded-[22px] bg-surface press" style={{ boxShadow: on ? '0 0 0 2px var(--p-orange), 0 10px 24px -14px var(--p-orange)' : '0 0 0 1px var(--line)', animation: `rise .5s var(--ease) ${i * 40}ms both`, opacity: keeps ? 1 : 0.62 }}>
            <div className="flex items-start gap-3"><Gloss n="shield" c={{ Bronze: '#B86A08', Silver: '#8D939D', Gold: 'var(--p-amber)', Platinum: 'var(--p-slate)' }[p.metal]} size={40} /><div className="flex-1 min-w-0"><div className="flex items-center gap-2 flex-wrap"><span className="text-[15px] font-bold text-ink">{p.name}</span>{p.id === rec && <span className="text-[11px] font-bold px-2 py-0.5 rounded-full text-white" style={{ background: 'var(--p-orange)' }}>Best for you</span>}{p.hsa && <span className="text-[11px] font-semibold px-2 py-0.5 rounded-full bg-bg2 text-ink2">HSA</span>}</div><div className="text-[12.5px] text-ink3">{p.carrier} · {p.metal} · {p.network}</div>
              {doctor && <div className="text-[12px] font-semibold mt-1" style={{ color: keeps ? 'var(--wl-ink)' : 'var(--bad)' }}>{keeps ? `Keeps ${doctor.name}` : `${doctor.name} is out of network`}</div>}</div>
              <div className="text-right flex-shrink-0"><div className="text-[18px] font-bold tight tabular text-ink">{q.net ? fmtMoney(q.net) : '$0'}<span className="text-[11px] text-ink3 font-medium">/mo</span></div><div className="text-[11px] text-ink3">after {fmtMoney(q.allow)} allowance</div></div></div>
            <div className="grid grid-cols-3 gap-2 mt-3 pt-3 border-t border-line text-[12px]"><div><div className="text-ink3">Deductible</div><div className="font-semibold text-ink tabular">{fmtMoney(p.deductible)}</div></div><div><div className="text-ink3">Out-of-pocket max</div><div className="font-semibold text-ink tabular">{fmtMoney(p.oop)}</div></div><div><div className="text-ink3">Est. yearly cost</div><div className="font-bold text-ink tabular">{fmtMoney(q.annual)}</div></div></div>
          </button>; })}
          <button className="text-[13px] font-semibold text-ink3 hover:text-ink mt-1" onClick={() => setWaive(true)}>I have other coverage, waive</button></>}</div>
        : step === 3 ? <div className="stagger space-y-5">{[['Dental', 'tooth', 'var(--p-teal)', DENTAL_PLANS, den, setDen, c.ancillary.dental], ['Vision', 'eye', 'var(--p-yellow)', VISION_PLANS, vis, setVis, c.ancillary.vision]].filter(x => x[6].on).map(([t, ic, cc, list, val, set, cfg]) => <div key={t}><div className="flex items-center gap-2 mb-2"><Gloss n={ic} c={cc} size={28} /><span className="text-[15px] font-semibold text-ink">{t}</span><span className="text-[12px] text-ink3">{cfg.employerPays === 100 ? `${company.name} pays 100%` : ''}</span></div><div className="space-y-2">{[...list, { id: '', name: `No ${t.toLowerCase()}`, carrier: '', covers: '' }].map(o => <button key={o.id || 'none'} onClick={() => set(o.id)} className="w-full flex items-center gap-3 p-3.5 rounded-[18px] bg-surface text-left press" style={{ boxShadow: val === o.id ? `0 0 0 2px ${cc}` : '0 0 0 1px var(--line)' }}><div className="flex-1"><div className="text-[14px] font-semibold text-ink">{o.name}</div>{o.covers && <div className="text-[12px] text-ink3">{o.carrier} · {o.covers}</div>}</div>{o.id && <span className="text-[13px] font-semibold tabular text-ink">{cfg.employerPays === 100 ? '$0' : fmtMoney(o.premium)}/mo</span>}</button>)}</div></div>)}
          {c.ancillary.life.on && <div><div className="flex items-center gap-2 mb-2"><Gloss n="shield" c="var(--p-slate)" size={28} /><span className="text-[15px] font-semibold text-ink">Life insurance</span><span className="text-[12px] text-ink3">1x salary is free</span></div><div className="grid grid-cols-3 gap-2">{LIFE_OPTIONS.map(o => <button key={o.id} onClick={() => setLife(o.id)} className="p-3.5 rounded-[18px] bg-surface text-left press" style={{ boxShadow: life === o.id ? '0 0 0 2px var(--p-slate)' : '0 0 0 1px var(--line)' }}><div className="text-[14px] font-semibold text-ink">{o.label}</div><div className="text-[12px] text-ink3">{o.premium ? fmtMoney(o.premium) + '/mo' : 'Free'}</div></button>)}</div></div>}</div>
        : <div className="stagger space-y-4">{waive ? <Card className="p-5"><div className="text-[15px] font-semibold text-ink">Waiving medical for {py}</div><div className="text-[13px] text-ink2 mt-1">Reason: {why}</div></Card> : <Card className="p-5 divide-line"><Row l={`${picked.p.name}, ${tierById(tier).label.toLowerCase()}`} v={fmtMoney(picked.q.prem) + '/mo'} /><Row l={`${company.name} allowance`} v={'−' + fmtMoney(Math.min(picked.q.prem, picked.q.allow))} />{dP && <Row l={dP.name} v={c.ancillary.dental.employerPays === 100 ? 'Covered' : fmtMoney(dP.premium)} />}{vP && <Row l={vP.name} v={c.ancillary.vision.employerPays === 100 ? 'Covered' : fmtMoney(vP.premium)} />}<Row l={`Life, ${lP.label}`} v={lP.premium ? fmtMoney(lP.premium) : 'Free'} /><Row l="You pay per month, pre-tax" v={<span className="text-[20px] font-bold tight">{fmtMoney(picked.q.net + extras)}</span>} bold /></Card>}
          <label className="flex items-start gap-3 p-4 rounded-[18px] bg-surface cursor-pointer" style={{ boxShadow: '0 0 0 1px var(--line)' }}><input type="checkbox" checked={sign} onChange={e => setSign(e.target.checked)} className="mt-1 w-4 h-4 accent-[var(--p-orange)]" /><span className="text-[13.5px] text-ink2 leading-relaxed">{waive ? `I confirm I have other coverage and understand I can enroll later only with a qualifying life event.` : `I attest that I and anyone I cover will be enrolled in individual health coverage for the ${py} plan year, and I’ll show proof when asked. I understand that accepting this ICHRA means I can’t claim the premium tax credit.`}</span></label>
          <div className="text-[12px] text-ink3">Signed electronically as {employee.name}, {fmtDate(iso(today()))}.</div></div>}
      </div>
      {!done && <div className="px-6 py-4 bg-surface border-t border-line flex items-center justify-between gap-3">{step > 0 ? <button className="text-[14px] font-semibold text-ink2 hover:text-ink inline-flex items-center gap-1" onClick={() => setStep(waive && step === 4 ? 2 : step - 1)}>{I.chevL(15)}Back</button> : <span />}
        {step < 4 ? <Button size="lg" onClick={() => setStep(waive && step === 2 ? 4 : step + 1)} iconRight={I.arrowR(15)}>{step === 2 && !waive ? <><span className="sm:hidden">Continue</span><span className="hidden sm:inline">Continue with {picked.p.name}</span></> : 'Continue'}</Button> : <Button size="lg" variant="accent" disabled={!sign} onClick={finish}>{waive ? 'Waive coverage' : 'Sign and enroll'}</Button>}</div>}
    </div></div>, document.body);
}

function LifeEventSheet({ open, onClose }) {

  return <Modal open={open} onClose={onClose} title={L ? L.label : 'Report a life event'}>{!L ? <div className="space-y-2.5"><p className="text-[13.5px] text-ink2 text-center -mt-1 mb-3">These let you change coverage outside open enrollment. Report within 60 days.</p>{LIFE_EVENTS.map((l, i) => <button key={l.id} onClick={() => setEv(l.id)} className="w-full flex items-center gap-4 p-3 pr-4 rounded-[22px] bg-surface text-left press" style={{ boxShadow: '0 0 0 1px var(--line), 0 2px 8px -4px rgba(0,0,0,.08)', animation: `rise .5s var(--ease) ${i * 45}ms both` }}><Gloss n={l.icon} c={l.c} size={46} /><span className="flex-1 text-[15px] font-semibold text-ink">{l.label}</span><span className="text-ink3">{I.chevR(15)}</span></button>)}</div>
    : <div className="space-y-4 stagger"><Input label="Date of the event" type="date" value={date} max={iso(today())} onChange={e => setDate(e.target.value)} />{L.dep && <Input label={L.dep === 'Child' ? 'Child’s name' : 'Spouse or partner’s name'} value={nm} onChange={e => setNm(e.target.value)} placeholder="Full name" />}
      <div><div className="text-[13px] font-medium text-ink2 mb-1.5">Proof</div><label className="flex items-center gap-3 p-4 rounded-[18px] border border-dashed border-line2 cursor-pointer hover:bg-sunk"><span className="text-ink3">{I.upload(18)}</span><span className="text-[13.5px] text-ink2 flex-1">{file || L.doc}</span><input type="file" className="hidden" onChange={e => e.target.files[0] && setFile(e.target.files[0].name)} /></label>{!file && <button className="text-[12.5px] font-semibold text-ink3 hover:text-ink mt-1.5" onClick={() => setFile('sample-proof.pdf')}>Use a sample document</button>}</div>
      <p className="text-[12.5px] text-ink3">Pulse sends this to {company.name}’s admin for approval, then your special enrollment window opens. Your allowance updates with your family size.</p>
      <Button className="w-full" size="lg" disabled={!file || (L.dep && !nm)} onClick={submit}>Submit</Button><button className="text-[13px] font-semibold text-ink3 w-full" onClick={() => setEv(null)}>Pick a different event</button></div>}</Modal>;
}

function ReimbSheet({ open, onClose }) {

/* Notifications */
function empNotifications(employee, company) {
  const out = []; const oe = enrollmentState(company); const el = electionFor(employee, company); const sep = openSep(employee);
  if (oe.status === 'open' && !el) out.push({ id: 'oe', icon: 'calendar', c: 'var(--p-orange)', t: `Open enrollment closes in ${oe.daysLeft} days`, to: '/me/benefits', open: 'enroll' });
  if (sep) out.push({ id: 'sep', icon: 'calendar', c: 'var(--p-coral)', t: `Your life event was approved. Update coverage by ${fmtDate(sep.windowEnd)}`, to: '/me/benefits', open: 'enroll' });
  if (!proofFor(employee, monthKey()) && !(el && el.status === 'waived')) out.push({ id: 'proof', icon: 'shield', c: 'var(--p-slate)', t: `Show proof of coverage for ${monthName()}`, to: '/me/benefits' });
  db.where('lifeEvents', x => x.employeeId === employee.id && x.status === 'pending').forEach(x => out.push({ id: 'le' + x.id, icon: 'clock', c: 'var(--p-amber)', t: 'Life event waiting for approval', to: '/me/benefits' }));
  db.where('cases', c => c.employeeId === employee.id && c.status === 'resolved').slice(0, 1).forEach(c => out.push({ id: 'case' + c.id, icon: 'receipt', c: 'var(--p-teal)', t: `Your advocate saved you ${fmtMoney(c.amount - c.final)} on ${c.provider}`, to: '/me/care/help' }));
  return out;
}
function EmpBell() {
  const { employee, company } = useEmp(); const [open, setOpen] = useState(false); const list = empNotifications(employee, company);
  return <div className="relative"><button onClick={() => setOpen(!open)} aria-label="Notifications" className="w-10 h-10 rounded-full bg-surface flex items-center justify-center text-ink2 press relative" style={{ boxShadow: '0 0 0 1px var(--line), 0 2px 8px -4px rgba(0,0,0,.12)' }}>{I.bell(17)}{list.length > 0 && <span className="absolute -top-0.5 -right-0.5 min-w-[18px] h-[18px] px-1 rounded-full text-[10.5px] font-bold text-white flex items-center justify-center pop" style={{ background: 'var(--p-orange)' }}>{list.length}</span>}</button>
    {open && <><div className="fixed inset-0 z-40" onClick={() => setOpen(false)} /><div className="absolute right-0 mt-2 w-[min(88vw,340px)] card p-2 z-50 pop" style={{ boxShadow: 'var(--shadow-pop)', transformOrigin: 'top right' }}><div className="px-3 py-2 text-[13px] font-semibold text-ink3">Notifications</div>{list.length ? list.map((n, i) => <button key={n.id} onClick={() => { setOpen(false); if (n.open) sessionStorage.setItem('pulse_open', n.open); navigate(n.to); }} className="w-full flex items-center gap-3 p-2.5 rounded-[14px] hover:bg-bg2 text-left" style={{ animation: `rise .4s var(--ease) ${i * 40}ms both` }}><Gloss n={n.icon} c={n.c} size={32} /><span className="text-[13.5px] text-ink leading-snug">{n.t}</span></button>) : <div className="px-3 py-6 text-center text-[13.5px] text-ink3">You’re all caught up</div>}</div></>}</div>;
}

function askEmployee(q, c) {
  const s = q.toLowerCase(); const { employee, company } = c; const plan = planById(employee.planId);
  if (/(id card|insurance card|member id|member number)/.test(s)) return { html: `Your member ID is <b>${memberId(employee, plan)}</b> with <b>${plan.carrier}</b> (${plan.name}). Dental and vision cards are there too.`, actions: [{ label: 'Open ID cards', to: '/me/benefits', primary: true }] };
  if (/(open enrollment|enroll|pick a plan|choose a plan|change (my )?plan|which plan|best plan)/.test(s)) { const oe = enrollmentState(company); const el = electionFor(employee, company); const best = PLANS.map(p => ({ p, q: planQuote(company, employee, p) })).sort((a, b) => a.q.annual - b.q.annual)[0]; return { html: el && el.status === 'complete' ? `You’re enrolled in <b>${planById(el.medical).name}</b> for ${oe.planYear.start.slice(0, 4)}. You can change it until ${fmtDate(oe.end)}.` : `Open enrollment is ${oe.status} with <b>${oe.daysLeft} days</b> left. For typical use, <b>${best.p.name}</b> (${best.p.carrier}) looks cheapest overall: about ${fmtMoney(best.q.annual)} a year after your ${fmtMoney(best.q.allow)} allowance.`, actions: [{ label: 'Start enrolling', to: '/me/benefits', primary: true }] }; }
  const doc = PROVIDERS.find(p => s.includes(p.name.toLowerCase().replace('dr. ', '').split(' ').slice(-1)[0]) && /dr|doctor|network/.test(s));
  if (doc) return { html: doc.nets.includes(plan.carrier) ? `<b>Yes.</b> ${doc.name} (${doc.spec}, ${doc.place}) is in network for your ${plan.name}. Next opening: ${doc.next}.` : `<b>No.</b> ${doc.name} is out of network for ${plan.name}. During open enrollment you can pick a plan that keeps them.`, actions: [{ label: 'Find a doctor', to: '/me/care/doctors' }] };
  if (/(in.network|find a doctor|find a dermatologist|specialist near)/.test(s)) return { html: `Pulse shows doctors in network for your <b>${plan.name}</b> with what each visit will cost you.`, actions: [{ label: 'Find a doctor', to: '/me/care/doctors', primary: true }] };
  if (/(deductible|out of pocket|out-of-pocket)/.test(s)) return { html: plan.deductible ? `You’ve met <b>${fmtMoney(deductibleMet(employee))}</b> of your ${fmtMoney(plan.deductible)} deductible and ${fmtMoney(oopMet(employee))} of your ${fmtMoney(plan.oop)} out-of-pocket max.` : `Your ${plan.name} has <b>no deductible</b>. Out-of-pocket so far: ${fmtMoney(oopMet(employee))} of ${fmtMoney(plan.oop)}.`, actions: [{ label: 'See my plan', to: '/me/benefits' }] };
  if (/(mri|urgent care|emergency room|er visit|how much (does|will|would) .*(cost|be))/.test(s)) { const svc = SERVICES.find(x => s.includes(x.id) || s.includes(x.label.toLowerCase().split(' ')[0])) || SERVICES[0]; return { html: `<b>${svc.label}</b>: about <b>${fmtMoney(serviceCost(plan, svc, deductibleMet(employee)))}</b> for you on ${plan.name}, versus ${fmtMoney(svc.list)} list price.`, actions: [{ label: 'See more estimates', to: '/me/care/doctors' }] }; }
  if (/(baby|pregnan|married|wedding|life event|moved|new zip|lost (my )?coverage|divorce)/.test(s)) return { html: `That’s a qualifying life event. Report it within 60 days and you can change your coverage. Your allowance grows with your family.`, actions: [{ label: 'Report a life event', to: '/me/benefits', primary: true }] };
  if (/(bill|charged|claim (was )?denied|overcharg)/.test(s)) return { html: `Send it to a Pulse advocate. They check it against your plan and call the provider for you, free. Last time they cut a bill from $640 to $180.`, actions: [{ label: 'Get help with a bill', to: '/me/care/help', primary: true }] };
  if (/(proof of coverage|substantiat)/.test(s)) return { html: proofFor(employee, monthKey()) ? `You’re all set for ${monthName()}.` : `${monthName()} still needs proof. One tap checks with ${plan.carrier}.`, actions: [{ label: 'Verify now', to: '/me/benefits' }] };
  return askEmployeeV3(q, c);
}

        <Card className="p-6 h-fit"><div className="text-[15px] text-ink2">Monthly cap per person</div><div className="text-[30px] text-ink tabular mt-1">{fmtMoney(inc.monthlyCap)}</div><input type="range" min={50} max={300} step={10} value={inc.monthlyCap} onChange={e => setInc({ ...inc, monthlyCap: +e.target.value })} className="range mt-3" aria-label="Monthly cap" />
          <div className="mt-6"><div className="flex justify-between text-[13.5px]"><span className="text-ink2">Health-contingent share</span><span className="tabular" style={{ color: comp.ok ? (comp.warn ? 'var(--watch)' : 'var(--good)') : 'var(--bad)' }}>{(comp.ratio * 100).toFixed(1)}%</span></div><div className="mt-2"><Progress value={comp.ratio / 0.3 * 100} color={comp.ok ? (comp.warn ? 'var(--watch)' : 'var(--good)') : 'var(--bad)'} h={5} /></div><p className="text-[12.5px] text-ink3 mt-3 leading-relaxed">{(n => n ? `${plural(n, 'person', 'people')} use an alternative standard (names never shown). ` : '')(stats.emps.filter(e => e.alternatives && Object.keys(e.alternatives).length).length)}{comp.ok ? 'Inside the HIPAA 30% safe harbor. Preventive rewards are participatory and do not count.' : 'Over the 30% limit. Lower habit amounts or the cap to publish.'}</p></div>
          <div className="mt-5 pt-4 border-t border-line divide-line"><Row l="If everyone maxes out" v={fmtMoney(Math.min(sum(inc.goals.filter(g => g.enabled).map(g => g.amount)), inc.monthlyCap) * n) + '/mo'} /><Row l="Typical (about 60%)" v={fmtMoney(Math.min(sum(inc.goals.filter(g => g.enabled).map(g => g.amount)), inc.monthlyCap) * n * 0.6) + '/mo'} bold /></div></Card></div>}
      {tab === 'budget' && <div className="grid md:grid-cols-2 gap-5">{[['ichraMonthly', 'Premium allowance', 'Toward each person’s individual plan (ICHRA)', 200, 900, 25], ['walletMonthly', 'Wellness wallet', 'For classes, recovery, therapy, nutrition', 0, 400, 25]].map(([k, l, s, mi, ma, st]) => <Card key={k} className="p-6"><div className="text-[15px] text-ink">{l}</div><div className="text-[13px] text-ink3">{s}</div><div className="text-[34px] text-ink tabular mt-3">{fmtMoney(plan[k])}<span className="text-[14px] text-ink3">/person/mo</span></div><input type="range" min={mi} max={ma} step={st} value={plan[k]} onChange={e => setPlan({ ...plan, [k]: +e.target.value })} className="range mt-4" aria-label={l} /><div className="text-[13px] text-ink2 mt-3">{fmtMoney(plan[k] * n)}/month across {n} people</div></Card>)}</div>}
    </Tabs></>;
}

function digestText(company, stats, user) { const st = automationStats(company); const items = needsYou(company, stats); const ps = programScore(stats); return `Good morning, ${user.name.split(' ')[0]}. Here is your Pulse week. Program score is ${ps.score}, ${ps.label.toLowerCase()}. ${stats.connected.length} of ${stats.active.length} people are connected and ${Math.round(stats.earningRate * 100)} percent earned a reward this month. Pulse took ${st.actions} actions for you and saved about ${st.hours} hours. ${items.length ? `${items.length} things need you, starting with: ${stripHtml(items[0].html)}.` : 'Nothing needs you.'} ${stats.flagged.length >= 3 ? `Heads up: ${stats.flagged.length} people show a simultaneous decline in sleep and recovery.` : 'Team health is steady.'}`; }

/* ─── INSIGHTS (Mercury Insights layout) ─── */
function ErInsights() {
  const { company, stats } = useEr(); const toast = useToast(); const [metric, setMetric] = useState('sleep'); const ps = programScore(stats); const roi = roiModel(stats, company);
  useEffect(() => { audit(company.id, adminName(company), 'Viewed team insights (aggregate)', null, ''); }, []);
  const W = stats.weeks; const first = W[0], last = W[W.length - 1];
  const S = { sleep: { label: 'Avg sleep', data: W.map(w => +w.sleep.toFixed(2)), fmt: v => v.toFixed(2) + 'h' }, hrv: { label: 'Avg HRV', data: W.map(w => Math.round(w.hrv)), fmt: v => Math.round(v) + ' ms' }, exercise: { label: 'Active min/wk', data: W.map(w => Math.round(w.exercise)), fmt: v => Math.round(v) + ' min' }, adoption: { label: 'Adoption', data: stats.months.map(m => Math.round(m.rate * 100)), fmt: v => Math.round(v) + '%' } };
  const ch = (k) => first && first[k] ? ((last[k] - first[k]) / first[k] * 100) : 0;
  const topGoal = [...stats.goalStats].sort((a, b) => b.paid - a.paid)[0];
  const phys = pct(stats.prevDone('physical'), stats.active.length), dent = pct(stats.prevDone('dental'), stats.active.length), blood = pct(stats.prevDone('bloodwork'), stats.active.length);
  const C = ({ children }) => <span className="inline-block px-1.5 rounded-md bg-bg2 text-ink">{children}</span>;
  const insights = [
    { icon: 'arrowUpR', title: 'Adoption', body: <><C>{stats.connected.length} of {stats.active.length}</C> people have a device connected ({Math.round(stats.connectionRate * 100)}%). Typical employer wellness programs see about a third of people engage.</> },
    { icon: ch('sleep') >= 0 ? 'arrowUpR' : 'arrowDownR', title: 'Sleep and recovery', body: <>Average <C>sleep</C> is {last ? last.sleep.toFixed(1) : '—'}h, {Math.abs(ch('sleep')).toFixed(1)}% {ch('sleep') >= 0 ? 'up' : 'down'} over 8 weeks. Average <C>HRV</C> is {last ? Math.round(last.hrv) : '—'} ms, {ch('hrv') >= 0 ? 'up' : 'down'} {Math.abs(ch('hrv')).toFixed(1)}%.</> },
    { icon: 'spark', title: 'Rewards', body: <><C>{fmtMoney(stats.bonuses)}</C> paid this month across {stats.earning} people. {topGoal ? <><C>{topGoal.short}</C> drove {pct(topGoal.paid, Math.max(1, stats.bonuses))}% of it.</> : null}</> },
    { icon: 'shield', title: 'Preventive care', body: <><C>{phys}%</C> completed an annual physical, {dent}% a dental checkup, {blood}% a bloodwork panel. {blood < 40 ? 'Bloodwork is the easiest lift: it is covered and most people do not know.' : ''}</> },
  ];
  return <><ErTitle title="Insights" right={<><Button size="sm" variant="secondary" icon={I.book(14)} onClick={() => navigate('/employer/report/board')}>Board report</Button><Button size="sm" variant="secondary" icon={I.download(14)} onClick={() => exportTeamCsv(company, stats)}>Export</Button></>} />
    {stats.connected.length < 5 ? <Card><Empty icon="lock" title="Insights unlock at 5 connected people" body="Pulse never shows team data for groups smaller than 5, so no one can be singled out." /></Card> : <>
      <div className="grid grid-cols-2 md:grid-cols-4 gap-5 md:gap-8 py-2">{[['Program score', ps.score], ['Adoption', Math.round(stats.connectionRate * 100) + '%'], ['Rewards paid', fmtMoney(stats.bonuses)], ['Est. ROI', roi.multiple + 'x']].map(([l, v], i) => <div key={l}><div className="text-[14px] text-ink2 inline-block border-b border-dotted border-ink3">{l}</div><div className={cx('text-ink tabular mt-1', i === 0 ? 'text-[44px]' : 'text-[30px] md:mt-3')} style={{ fontWeight: 700, letterSpacing: '-0.03em' }}>{v}</div></div>)}</div>
      <div className="grid lg:grid-cols-12 gap-8 mt-8">
        <div className="lg:col-span-5 space-y-7">{insights.map(x => <div key={x.title} className="flex gap-3"><span className="text-ink mt-1">{I[x.icon](15)}</span><div><div className="text-[15.5px] text-ink font-medium">{x.title}</div><p className="text-[14.5px] text-ink2 mt-1 leading-relaxed">{x.body}</p></div></div>)}</div>
        <div className="lg:col-span-7"><div className="flex justify-end mb-3"><Segmented label="Metric" value={metric} onChange={setMetric} options={[{ value: 'sleep', label: 'Sleep' }, { value: 'hrv', label: 'HRV' }, { value: 'exercise', label: 'Activity' }, { value: 'adoption', label: 'Adoption' }]} /></div><AreaChart data={S[metric].data} labels={metric === 'adoption' ? stats.months.map(m => m.label) : W.map(w => w.label)} fmt={S[metric].fmt} height={300} /></div>
      </div>
      <p className="text-[12.5px] text-ink3 mt-6">Trends are generated from synthetic demo data and may include inaccuracies.</p>
      <div className="h-px bg-line my-10" />
      <div className="grid lg:grid-cols-3 gap-5">
        <Card className="p-6 lg:col-span-2"><div className="flex items-center justify-between"><a href="#/employer/signal" className="text-[17px] text-ink hover:underline inline-flex items-center gap-1">Team health signal {I.chevR(14)}</a><StatusPill status={stats.flagged.length >= 3 ? 'watch' : 'optimal'}>{stats.flagged.length >= 3 ? 'Active' : 'Steady'}</StatusPill></div><p className="text-[14px] text-ink2 mt-2 leading-relaxed">{stats.flagged.length >= 3 ? <><b className="text-ink font-medium">{stats.flagged.length} people ({pct(stats.flagged.length, stats.connected.length)}% of connected)</b> show a simultaneous 3-week decline in sleep, HRV and movement. This pattern tends to show up 4 to 8 weeks before burnout. Pulse does not tell you who.</> : 'No team-level decline. Pulse checks every night and will flag it here and in Needs you.'}</p>
          <div className="mt-5"><AreaChart data={W.map(w => +w.hrv.toFixed(1))} labels={W.map(w => w.label)} fmt={v => v.toFixed(0) + ' ms'} height={170} color={stats.flagged.length >= 3 ? 'var(--watch)' : 'var(--data)'} /></div>
          <div className="flex flex-wrap gap-2 mt-4">{company.recoveryWeek ? <Button variant="secondary" size="sm" onClick={() => { setRecovery(company, false); toast('Recovery week ended'); }}>End recovery week</Button> : <Button size="sm" onClick={() => { setRecovery(company, true); toast('Recovery week on'); }}>Turn on recovery week</Button>}<Button size="sm" variant="secondary" onClick={() => { db.log('wellness_day', company.id, {}); toast('Wellness day announced'); }}>Announce a wellness day</Button></div></Card>
        <Card className="p-6"><div className="text-[17px] text-ink">Goal performance</div><div className="mt-3 divide-line">{stats.goalStats.map(g => <div key={g.id} className="py-3"><div className="flex justify-between text-[14px]"><span className="text-ink">{g.short}</span><span className="text-ink2 tabular">{pct(g.met, g.enrolled)}% met</span></div><div className="mt-1.5"><Progress value={pct(g.met, g.enrolled)} color="var(--data)" h={4} /></div><div className="text-[12px] text-ink3 mt-1">{g.enrolled} enrolled · {fmtMoney(g.paid)} paid</div></div>)}</div></Card>
      </div>
      <RetentionSection />
    </>}</>;
}

function DualLine({ a, b, labels, height = 220, fmt = v => v.toFixed(1), ca = 'var(--watch)', cb = 'var(--data)' }) {
  const ref = useRef(); const [w, setW] = useState(640);
  useEffect(() => { if (!ref.current) return; const ro = new ResizeObserver(e => setW(e[0].contentRect.width)); ro.observe(ref.current); return () => ro.disconnect(); }, []);
  const all = [...a, ...b].filter(v => isFinite(v)); if (!all.length) return <div ref={ref} style={{ height }} />;
  const max = Math.max(...all), min = Math.min(...all), pad = (max - min) * 0.25 || 1; const L = 46;
  const y = v => height - 26 - ((v - (min - pad)) / ((max + pad) - (min - pad))) * (height - 40); const x = i => L + i / Math.max(1, a.length - 1) * (w - L - 10);
  const path = arr => arr.map((v, i) => (i ? 'L' : 'M') + x(i).toFixed(1) + ' ' + y(v).toFixed(1)).join(' ');
  return <div ref={ref}><svg width={w} height={height} aria-hidden="true">{[min, (min + max) / 2, max].map((t, i) => <g key={i}><line x1={L} x2={w - 10} y1={y(t)} y2={y(t)} stroke="var(--line)" strokeDasharray="1 5" strokeWidth="1.5" strokeLinecap="round" /><text x={L - 8} y={y(t) + 3.5} textAnchor="end" fontSize="10.5" style={{ fill: 'var(--ink3)' }}>{fmt(t)}</text></g>)}
    <path d={path(b)} fill="none" stroke={cb} strokeWidth="1.8" opacity=".7" /><path d={path(a)} fill="none" stroke={ca} strokeWidth="2.2" />{a.map((v, i) => <circle key={i} cx={x(i)} cy={y(v)} r={i === a.length - 1 ? 4 : 2.5} fill={ca} />)}
    {labels.map((l, i) => (i % 2 === 0 || i === labels.length - 1) && <text key={i} x={x(i)} y={height - 6} textAnchor={i === 0 ? 'start' : i === labels.length - 1 ? 'end' : 'middle'} fontSize="11" style={{ fill: 'var(--ink3)' }}>{l}</text>)}</svg></div>;
}

function spendSeries(company, stats) {

  return out;
}
function savingsModel(company, stats) {

  ];

        <Card className="p-6"><div className="text-[16px] font-semibold text-ink">Plans your team can pick</div><div className="mt-3 divide-line">{PLANS.map(p => <div key={p.id} className="flex items-center gap-3 py-2.5"><Gloss n="shield" c={{ Bronze: '#B86A08', Silver: '#8D939D', Gold: 'var(--p-amber)', Platinum: 'var(--p-slate)' }[p.metal]} size={30} /><div className="flex-1 min-w-0"><div className="text-[13.5px] font-semibold text-ink truncate">{p.name}</div><div className="text-[11.5px] text-ink3">{p.carrier} · {p.network}</div></div><span className="text-[12.5px] tabular text-ink2">{fmtMoney(p.premium)}<span className="text-ink3">/mo at 40</span></span></div>)}</div><p className="text-[11.5px] text-ink3 mt-2">Individual market plans in San Francisco. Prices set by carriers and regulated by the state.</p></Card>
        <Card className="p-6"><div className="text-[16px] font-semibold text-ink">Affordability</div><p className="text-[13px] text-ink2 mt-1">{stats.active.length < 50 ? `With ${stats.active.length} employees you’re not an applicable large employer, so the ACA affordability test doesn’t apply. Pulse keeps checking monthly.` : 'Pulse tests each class against the ACA affordability safe harbor using the lowest-cost silver plan.'}</p></Card>

    <SecHead title="Other benefits" className="mt-8" />
    <div className="grid sm:grid-cols-2 lg:grid-cols-4 gap-4">{[['dental', 'tooth', 'var(--p-teal)', 'Dental', `Guardian, Delta Dental · you pay ${anc.dental.employerPays}%`], ['vision', 'eye', 'var(--p-yellow)', 'Vision', `VSP · you pay ${anc.vision.employerPays}%`], ['life', 'shield', 'var(--p-slate)', 'Life insurance', anc.life.amount], ['disability', 'bandage', 'var(--p-red)', 'Disability', anc.disability.kind], ['hsa', 'drop', 'var(--p-blue)', 'HSA', `${fmtMoney(anc.hsa.employerSeed)}/mo seed on HSA plans`], ['fsa', 'card', 'var(--p-sea)', 'FSA and dependent care', 'Pre-tax, $3,300 health limit'], ['commuter', 'steps', 'var(--p-orange)', 'Commuter', 'Pre-tax transit and parking'], ['k401', 'chart', 'var(--p-lime)', '401(k)', `${anc.k401.provider} · ${anc.k401.match}`], ['eap', 'brain', 'var(--p-coral)', 'EAP', 'Confidential counseling for anyone']].map(([k, ic, cc, l, d]) => <Card key={k} className="p-4"><div className="flex items-center justify-between"><Gloss n={ic} c={anc[k] && anc[k].on ? cc : 'var(--line2)'} size={38} /><Toggle on={!!(anc[k] && anc[k].on)} onChange={v => { setAnc(k, { on: v }); toast(`${l} ${v ? 'added. Employees can enroll now.' : 'removed at next plan year.'}`); }} label={l} /></div><div className="text-[14.5px] font-semibold text-ink mt-3">{l}</div><div className="text-[12.5px] text-ink3 mt-0.5">{d}</div></Card>)}</div>
  </>;
}

function ErCompliance() {
  const { company, stats, user } = useEr(); const toast = useToast(); const tasks = complianceTasks(company, stats); const ok = tasks.filter(t => t.ok).length; const [doc, setDoc] = useState(null);
  const mark = t => { if (t.id === 'proofs') { toast('Reminders sent to people missing proof'); return; } if (['plan_doc', 'wellness_notice', 'privacy', 's125'].includes(t.id)) { setDoc(t.id === 'wellness_notice' ? 'wellness_notice' : t.id === 's125' ? 'plan_doc' : t.id === 'privacy' ? 'privacy' : 'plan_doc'); return; } db.update('companies', company.id, { complianceDone: { ...(company.complianceDone || {}), [t.id]: iso(today()) } }); audit(company.id, user.name, `Completed: ${t.title}`, null, ''); toast(t.id === 'ichra_notice' ? `ICHRA notice sent to ${stats.active.length} people. Delivery logged.` : 'Prepared. Pulse files it before the deadline.'); };
  return <><ErTitle title="Compliance" sub="Everything the IRS, DOL and HIPAA expect from an ICHRA and a wellness program, tracked for you." />
    <Card className="p-6 mb-5 flex flex-col md:flex-row md:items-center gap-5 rise"><MetricRing size={108} stroke={11} value={ok / tasks.length * 100} color="var(--p-teal)" center={<span className="text-[22px] font-bold tight text-ink">{ok}<span className="text-[13px] text-ink3">/{tasks.length}</span></span>} /><div className="flex-1"><div className="text-[19px] font-bold tight text-ink">{ok === tasks.length ? 'You’re fully compliant' : `${tasks.length - ok} things to finish`}</div><p className="text-[13.5px] text-ink2 mt-1">Pulse generates the documents, sends the notices, collects proof of coverage and reminds you before every deadline.</p><p className="text-[11.5px] text-ink3 mt-2">Demo checklist. Confirm requirements with benefits counsel before relying on it.</p></div></Card>
    <Card className="divide-line overflow-hidden">{tasks.map((t, i) => <div key={t.id} className="flex items-start gap-4 px-6 py-4" style={{ animation: `rise .45s var(--ease) ${i * 35}ms both` }}><span className="w-7 h-7 rounded-full flex items-center justify-center flex-shrink-0 mt-0.5" style={{ background: t.ok ? 'var(--wl-soft)' : 'var(--watch-soft)', color: t.ok ? 'var(--wl-ink)' : 'var(--watch)' }}>{t.ok ? I.check(14) : I.clock(14)}</span>
      <div className="flex-1 min-w-0"><div className="text-[14.5px] font-semibold text-ink">{t.title}</div><div className="text-[12.5px] text-ink3 mt-0.5">{t.why}</div>{(t.due || t.doneAt) && <div className="text-[12px] mt-1 font-medium" style={{ color: t.ok ? 'var(--ink3)' : t.due < iso(today()) ? 'var(--bad)' : 'var(--watch)' }}>{t.doneAt ? `Done ${fmtDate(t.doneAt)}` : t.due < iso(today()) ? `Overdue since ${fmtDate(t.due)}` : `Due ${fmtDate(t.due)}`}</div>}</div>
      {t.action && <Button size="sm" variant={t.ok ? 'ghost' : 'primary'} onClick={() => mark(t)}>{t.ok && !['proofs'].includes(t.id) ? 'View' : t.action}</Button>}</div>)}</Card>
    <Modal open={!!doc} onClose={() => setDoc(null)} title="Document" wide>{doc && <DocBody id={doc} emp={null} company={company} />}</Modal>
  </>;
}

function ErBilling() {

  return <><ErTitle title="Billing" sub="One invoice a month. Premiums, wallets, rewards and the Pulse fee, reconciled." right={<Button size="sm" variant="secondary" icon={I.download(14)} onClick={() => window.print()}>Download invoice</Button>} />

        <div className="mt-4 flex items-center gap-3 p-3.5 rounded-[16px] bg-sunk"><Gloss n="card" c="var(--p-slate)" size={32} /><div className="flex-1 text-[13px] text-ink2">ACH from Mercury •••• 4821 on the 1st</div><button className="text-[12.5px] font-semibold text-ink3 hover:text-ink" onClick={() => toast('Payment method updated')}>Change</button></div></Card>
      <div className="space-y-5">
        <Card className="p-6"><div className="flex items-center justify-between"><div className="text-[16px] font-semibold text-ink">Payroll deductions</div><Button size="sm" variant="secondary" onClick={() => { db.insert('payrollSyncs', { id: uid(), companyId: company.id, at: iso(today()), count: ded.length, provider: (company.payroll && company.payroll.provider) || 'Gusto' }); toast(`Sent ${ded.length} deductions to ${(company.payroll && company.payroll.provider) || 'Gusto'}`); }}>Sync now</Button></div><p className="text-[12.5px] text-ink3 mt-1">Premium above the allowance comes out of pay pre-tax (Section 125). Rewards are added as taxable income.</p>
          <div className="mt-3 divide-line">{ded.slice(0, 5).map(({ e, d }) => <div key={e.id} className="flex items-center justify-between py-2.5"><span className="text-[13.5px] text-ink">{e.name}</span><span className="text-[13px] tabular font-semibold text-ink">{fmtMoney(d.total)}<span className="text-ink3 font-normal">/mo</span></span></div>)}{ded.length > 5 && <div className="py-2.5 text-[12.5px] text-ink3">+ {ded.length - 5} more</div>}{!ded.length && <div className="py-3 text-[13px] text-ink3">Everyone’s plan is fully covered by their allowance.</div>}</div>
          {syncs[0] && <div className="text-[12px] text-ink3 mt-2">Last synced {fmtDate(syncs[0].at)} to {syncs[0].provider}</div>}</Card>
        <Card className="p-6"><div className="text-[16px] font-semibold text-ink">Reconciliation</div><div className="mt-3 divide-line"><Row l="Reimbursements with proof of coverage" v={`${proofStats(company, stats).have} of ${stats.active.length}`} /><Row l="Carrier premium checks" v="Matched" /><Row l="Unused wallet funds returned last month" v={fmtMoney(Math.max(0, Math.round(company.plan.walletMonthly * stats.active.length * 0.31)))} /></div></Card>
      </div>
    </div></>;

function TeamBenefitRows({ emp }) {
  const { company } = useEr(); const el = electionFor(emp, company); const p = planById(emp.planId);
  return <><Row l="Coverage" v={el && el.status === 'waived' ? 'Waived' : `${p.name}, ${tierById(tierOf(emp)).label.toLowerCase()}`} /><Row l="Allowance" v={`${fmtMoney(allowanceFor(company, emp))}/mo`} /><Row l="Enrollment" v={!el ? 'Not started' : el.status === 'complete' ? 'Enrolled' : el.status === 'waived' ? 'Waived' : 'In progress'} /><Row l="Proof of coverage" v={proofFor(emp, monthKey()) ? 'On file' : 'Missing this month'} /></>;
}

function askEmployer(q, c) {
  const s = q.toLowerCase(); const { company, stats } = c;
  if (/(enrollment|enrolled|open enrollment|who hasn.t enrolled)/.test(s)) { const es = enrollmentStats(company, stats); const oe = enrollmentState(company); return { html: `<b>${es.done} enrolled</b>, ${es.waived} waived, ${es.started + es.notStarted} still to go. Open enrollment closes ${fmtDate(oe.end)} (${oe.daysLeft} days).`, actions: [{ label: 'Open enrollment', to: '/employer/enrollment', primary: true }] }; }
  if (/(compliance|pcori|5500|aca|1095|notice|compliant)/.test(s)) { const t = complianceTasks(company, stats); const open = t.filter(x => !x.ok); return { html: open.length ? `<b>${t.length - open.length} of ${t.length}</b> done. Still open: ${open.map(x => x.title.split(':')[0].toLowerCase()).join(', ')}.` : 'Everything is done.', actions: [{ label: 'Compliance', to: '/employer/compliance', primary: true }] }; }
  if (/(invoice|billing|what do we pay|this month.s bill|how much do we owe)/.test(s)) { const inv = invoiceFor(company, stats, monthKey()); return { html: `This month’s invoice is <b>${fmtMoney(inv.total)}</b>: ${inv.lines.map(l => `${l.l} ${fmtMoney(l.v)}`).join(', ')}.`, actions: [{ label: 'Billing', to: '/employer/billing', primary: true }] }; }
  if (/(allowance|contribution|classes|age band)/.test(s)) { const c2 = bcfg(company); return { html: `Full-time base is <b>${fmtMoney(c2.classes[0].base)}/mo</b>${c2.ageBanded ? ', scaled by age' : ''} and family size. ${stats.active.filter(e => premiumFor(PLANS.find(p => p.id === 'silver'), e) <= allowanceFor(company, e)).length} of ${stats.active.length} can get Silver at no cost.`, actions: [{ label: 'Plans and contributions', to: '/employer/plans', primary: true }] }; }
  if (/(life event|baby|special enrollment)/.test(s)) { const n = db.where('lifeEvents', x => x.companyId === company.id && x.status === 'pending').length; return { html: n ? `<b>${plural(n, 'life event')}</b> waiting on your approval.` : 'No life events waiting.', actions: [{ label: 'Needs you', to: '/employer/inbox' }] }; }
  return askEmployerV3(q, c);
}

function App() {
  const route = useRoute(); const { user, company, employee } = useAuth();
  useEffect(() => { document.title = user ? (user.role === 'employer' ? `${company ? company.name : 'Pulse'} · Pulse` : 'Pulse') : 'Pulse · Health benefits that know you'; }, [user && user.id, route]);
  if (route === '/login') return <Login />;
  if (route === '/signup') return <Signup />;
  if (route.startsWith('/join')) return <Join />;
  if (!user || !company) { if (route.startsWith('/me') || route.startsWith('/employer')) { setTimeout(() => navigate('/login'), 0); return null; } return <Landing />; }
  if (user.role === 'employer') { if (!route.startsWith('/employer')) { setTimeout(() => navigate('/employer'), 0); return null; } return <EmployerApp user={user} company={company} route={route} />; }
  if (!employee) return <Landing />;
  if (!route.startsWith('/me')) { setTimeout(() => navigate('/me'), 0); return null; }
  return <EmployeeApp user={user} company={company} employee={employee} route={route} />;
}
class ErrorBoundary extends React.Component {
  constructor(p) { super(p); this.state = { err: null }; }
  static getDerivedStateFromError(err) { return { err }; }
  componentDidCatch(err, info) { console.error('Pulse error', err, info); }
  render() { if (this.state.err) return <div className="min-h-screen flex items-center justify-center p-8 bg-bg"><div className="card p-8 max-w-md text-center"><div className="serif text-[28px] text-ink">Something broke</div><p className="text-[14px] text-ink2 mt-2">{String(this.state.err.message || this.state.err)}</p><div className="flex justify-center gap-2 mt-5"><Button variant="secondary" onClick={() => { this.setState({ err: null }); navigate('/'); }}>Go home</Button><Button onClick={() => { seedDemo(); this.setState({ err: null }); navigate('/'); }}>Reset demo</Button></div></div></div>; return this.props.children; }
}
migrate();
ReactDOM.createRoot(document.getElementById('root')).render(<ErrorBoundary><ToastProvider><App /></ToastProvider></ErrorBoundary>);

</script>
