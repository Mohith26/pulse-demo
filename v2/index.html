/* ─── Tabs (WAI-ARIA, roving tabindex, merged active tab) ─── */

function complianceFor(inc, plan) {
  const contingent = sum(inc.goals.filter(g => g.enabled && goalById(g.id).type === 'activity').map(g => g.amount));
  const participatory = sum(inc.goals.filter(g => g.enabled && goalById(g.id).type === 'preventive').map(g => g.amount));
  const coverage = PLANS[1].premium * 12; const ratio = (Math.min(contingent, inc.monthlyCap) * 12) / coverage;
  return { contingent, participatory, coverage, ratio, ok: ratio <= 0.3, warn: ratio > 0.22 };
}
function BudgetSlider({ label, sub, value, min, max, step, onChange }) {

}
function useEnterToContinue(fn, enabled) { useEffect(() => { if (!enabled) return; const k = e => { if (e.key === 'Enter' && !['TEXTAREA'].includes(document.activeElement.tagName) && !e.metaKey) { e.preventDefault(); fn(); } }; window.addEventListener('keydown', k); return () => window.removeEventListener('keydown', k); }, [fn, enabled]); }

      <div key={step} className="mt-6 rise">{children}</div>
      <div className="flex items-center justify-between mt-6"><Button variant="ghost" onClick={onBack} disabled={step === 0} icon={I.arrowL(14)}>Back</Button><div className="flex items-center gap-3"><span className="hidden sm:flex items-center gap-1 text-2xs text-g9"><Kbd>↵</Kbd> to continue</span><Button size="lg" onClick={onNext} disabled={nextDisabled} icon={nextIcon || I.arrowR(14)}>{nextLabel}</Button></div></div></div></div>;

      <div className="mt-4 p-3 rounded-md border border-g4 bg-g2 flex items-center justify-between"><div className="text-sm text-g9">Potential monthly rewards</div><div className="tabular tight text-xl font-semibold text-g10">{fmtMoney(maxBonus)}</div></div></div>}

      <div className="mt-4 space-y-2"><Row l="Price" v={item.covered ? 'Covered by plan' : fmtMoney(item.price)} /><Row l="Wallet balance" v={fmtMoney(w.balance)} /><Row l="After booking" v={fmtMoney(w.balance - (item.covered ? 0 : item.price))} bold /></div>

function EmpBenefits({ company, employee, view }) {

    <div className="mt-3"><Tabs id="benefits" value={tab} onChange={setTab} tabs={[{ id: 'plan', label: 'Plan' }, { id: 'reimb', label: 'Reimbursements', count: reimb.length }]}>
      {tab === 'plan' && <div className="p-5 rise grid md:grid-cols-2 gap-6"><div><div className="flex items-center gap-2 mb-1"><div className="text-base font-semibold text-g10 tight">{plan.name}</div><Status tone="accent">Active</Status></div><div className="text-xs text-g9">{plan.carrier} · {plan.network}</div><div className="grid grid-cols-2 gap-2 mt-4">{[['Deductible', fmtMoney(plan.deductible)], ['Out-of-pocket max', fmtMoney(plan.oop)], ['Network', plan.network], ['HSA eligible', plan.hsa ? 'Yes' : 'No']].map(([l, v], i) => <div key={i} className="p-2.5 rounded-md border border-g4 bg-g2"><div className="text-2xs text-g9">{l}</div><div className="text-sm font-medium text-g10 tabular mt-0.5">{v}</div></div>)}</div><p className="text-2xs text-g9 mt-3">Open enrollment opens Nov 1. Switch plans then or after a qualifying life event.</p></div>
        <div className="space-y-2"><Row l="Monthly premium" v={fmtMoney(plan.premium)} /><div className="flex items-center justify-between text-sm"><span className="text-g9">{company.name} pays</span><span className="tabular font-medium text-accent-text">-{fmtMoney(company.plan.ichraMonthly)}</span></div>{employee.bonusRoute === 'premium' && <div className="flex items-center justify-between text-sm"><span className="text-g9">Rewards applied</span><span className="tabular font-medium text-accent-text">-{fmtMoney(view.ev.earned)}</span></div>}<div className="hr" /><div className="flex items-center justify-between"><span className="text-sm font-medium text-g10">You pay</span><span className={cx('tabular text-2xl font-semibold tight', afterBonus === 0 ? 'text-accent-text' : 'text-g10')}>{fmtMoney(afterBonus)}<span className="text-xs text-g9 font-normal">/mo</span></span></div></div></div>}

}
function EmpDevices({ company, employee }) {
  const toast = useToast(); const [connecting, setConnecting] = useState(null); const [syncing, setSyncing] = useState(false); const [confirm, setConfirm] = useState(false); const perms = employee.permissions || { sleep: true, hrv: true, activity: true, heart: true };

      <div className="mt-5"><div className="text-xs font-medium text-g9 mb-2">Data permissions</div><div className="grid sm:grid-cols-2 gap-1.5">{[['sleep', 'Sleep duration and stages'], ['hrv', 'Heart-rate variability'], ['activity', 'Activity minutes and steps'], ['heart', 'Resting heart rate']].map(([k, l]) => <div key={k} className="flex items-center justify-between p-2.5 rounded-md border border-g4"><span className="text-sm text-g10">{l}</span><Toggle on={perms[k]} onChange={v => { db.update('employees', employee.id, { permissions: { ...perms, [k]: v } }); toast(v ? 'Permission granted' : 'Permission revoked'); }} label={l} /></div>)}</div></div>
      <div className="mt-5 pt-4 border-t border-g4 flex items-center justify-between gap-3"><div className="text-2xs text-g9">Disconnecting pauses habit rewards. Your history stays private and is deleted on request.</div>{!confirm ? <Button variant="ghost" size="sm" onClick={() => setConfirm(true)}>Disconnect</Button> : <div className="flex gap-1.5"><Button variant="danger" size="sm" className="border border-g4" onClick={() => { db.update('employees', employee.id, { deviceId: null }); setConfirm(false); toast('Device disconnected'); }}>Confirm</Button><Button variant="ghost" size="sm" onClick={() => setConfirm(false)}>Cancel</Button></div>}</div></Card>
      : <Card className="rise"><Empty icon={I.watch(18)} title="No device connected" body="Connect a wearable to unlock habit rewards. We backfill the last 90 days so you can see your trends right away." /></Card>}
    <h2 className="text-sm font-semibold text-g10 mt-5 mb-2">{dev ? 'Switch device' : 'Connect a device'}</h2><Card className="divide-y divide-g4">{DEVICES.filter(d => d.id !== employee.deviceId).map((d, i) => <button key={d.id} onClick={() => connect(d.id)} disabled={!!connecting} className="w-full p-3.5 flex items-center gap-3 text-left row-hover focus-ring rise" style={{ animationDelay: i * 30 + 'ms' }}><div className="w-9 h-9 rounded-md border border-g4 bg-g2 text-g10 flex items-center justify-center mono text-sm font-medium">{d.glyph}</div><div className="flex-1"><div className="text-sm font-medium text-g10">{d.name}</div><div className="text-2xs text-g9">{d.blurb}</div></div>{connecting === d.id ? <span className="text-accent-text"><Spinner /></span> : <span className="text-xs text-accent-text font-medium">Connect</span>}</button>)}</Card>
    <div className="mt-3 p-3 rounded-md border border-g4 bg-g2 flex items-start gap-2 text-2xs text-g9">{I.lock(12)}<span><span className="font-medium text-g10">Privacy by design.</span> Your individual data never leaves your account. {company.name} sees anonymized team-level trends with a minimum group size of 5. Data is encrypted at rest and deleted 90 days after you leave.</span></div></div>;
}
function EmpProfile({ user, company, employee, view }) {
  const toast = useToast(); const [name, setName] = useState(employee.name); const [title, setTitle] = useState(employee.title || '');

    <div className="grid md:grid-cols-2 gap-3"><Card className="p-5 rise"><div className="flex items-center gap-3 mb-4"><Avatar name={employee.name} size={44} /><div><div className="font-semibold text-g10 text-base tight">{employee.name}</div><div className="text-xs text-g9">{employee.title}</div></div></div><div className="space-y-3"><Input label="Name" value={name} onChange={e => setName(e.target.value)} /><Input label="Title" value={title} onChange={e => setTitle(e.target.value)} /><Input label="Email" value={user.email} disabled className="opacity-60" /><Button onClick={() => { db.update('employees', employee.id, { name, title }); db.update('users', user.id, { name }); toast('Profile updated'); }}>Save</Button></div></Card>
      <div className="space-y-3"><Card className="p-5 rise" style={{ animationDelay: '60ms' }}><div className="text-sm font-semibold text-g10 mb-1">Tier</div><div className="text-xs text-g9 mb-3">Lifetime rewards <span className="mono text-g10 font-medium">{fmtMoney(view.lifetime)}</span></div><div className="flex items-center gap-1">{TIERS.map((t, i) => { const reached = view.lifetime >= t.min; const cur = view.tier.name === t.name; return <div key={t.name} className="flex-1"><div className={cx('h-1.5 rounded-full', reached ? 'bg-amber' : 'bg-g3')} /><div className={cx('text-2xs mt-1.5', cur ? 'text-g10 font-semibold' : 'text-g9')}>{t.name}</div><div className="mono text-2xs text-g9">{fmtMoney(t.min)}</div></div>; })}</div></Card>

    <div className="mt-5 flex items-center justify-between text-2xs text-g9"><span className="mono">Member since {fmtDateLong(employee.joinedAt)}</span><button onClick={() => { session.clear(); navigate('/'); }} className="font-medium text-g9 hover:text-g10 flex items-center gap-1 focus-ring rounded">{I.logout(12)} Log out</button></div></div>;
}

/* ═══════════════════════════════════════════════════════════════════════
   ROOT
   ═══════════════════════════════════════════════════════════════════════ */
function App() {
  const route = useRoute(); const { user, company, employee } = useAuth();
  useEffect(() => { const s = document.getElementById('splash'); if (s) { s.style.opacity = '0'; setTimeout(() => s.remove(), 300); } }, []);
  useEffect(() => { if (!user) return; if (user.role === 'employer' && !route.startsWith('/employer')) navigate('/employer'); if (user.role === 'employee' && !route.startsWith('/me')) navigate('/me'); }, [user && user.id, route.split('/')[1]]);
  if (!user) { if (route === '/login') return <Login />; if (route === '/signup') return <Signup />; if (route === '/join') return <Join />; return <Landing />; }
  if (user.role === 'employer') { if (!company) { session.clear(); return <Landing />; } if (!company.onboarded) return <EmployerOnboarding user={user} company={company} />; return <EmployerApp user={user} company={company} route={route.startsWith('/employer') ? route : '/employer'} />; }
  if (!employee || !company) { session.clear(); return <Landing />; }
  if (!employee.onboarded) return <EmployeeOnboarding user={user} company={company} employee={employee} />;
  return <EmployeeApp user={user} company={company} employee={employee} route={route.startsWith('/me') ? route : '/me'} />;
}
if (!localStorage.getItem(DB_KEY)) seedDemo();
ReactDOM.createRoot(document.getElementById('root')).render(<ToastProvider><App /></ToastProvider>);
</script>
