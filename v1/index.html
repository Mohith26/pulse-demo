function useAuth() {

}
function login(email, password) { const u = db.find('users', x => x.email.toLowerCase() === email.trim().toLowerCase()); if (!u) return { error: 'No account with that email.' }; if (u.password !== password) return { error: 'Incorrect password.' }; session.set({ userId: u.id }); return { user: u }; }
function signupEmployer({ name, email, password, companyName }) {
  if (db.find('users', x => x.email.toLowerCase() === email.trim().toLowerCase())) return { error: 'An account with that email already exists.' };
  const companyId = 'co_' + uid(), userId = 'u_' + uid();
  db.insert('users', { id: userId, email: email.trim(), password, name, role: 'employer', companyId, createdAt: iso(today()) });
  db.insert('companies', { id: companyId, name: companyName || 'My Company', industry: '', size: '', location: '', adminUserId: userId, createdAt: iso(today()), plan: { ichraMonthly: 400, walletMonthly: 100 }, incentives: defaultIncentives(), onboarded: false, recoveryWeek: false });
  session.set({ userId }); return { ok: true };
}
function joinWithInvite({ code, name, email, password }) {
  const inv = db.find('invites', i => i.code.toUpperCase() === code.trim().toUpperCase() && i.status === 'pending');
  if (!inv) return { error: 'That invite code is invalid or already used.' };
  if (db.find('users', x => x.email.toLowerCase() === email.trim().toLowerCase())) return { error: 'An account with that email already exists.' };
  const userId = 'u_' + uid(), empId = 'e_' + uid();
  db.insert('users', { id: userId, email: email.trim(), password, name, role: 'employee', companyId: inv.companyId, createdAt: iso(today()) });
  db.insert('employees', { id: empId, userId, companyId: inv.companyId, name, email: email.trim(), title: inv.title || 'Team member', status: 'active', deviceId: null, deviceConnectedAt: null, goals: [], planId: null, joinedAt: iso(today()), onboarded: false, trajectory: 'stable', priorEarned: 0, bonusRoute: 'wallet', permissions: { sleep: true, hrv: true, activity: true, heart: true } });

  db.log('employee_joined', inv.companyId, { name }); session.set({ userId }); return { ok: true };
}

function complianceFor(inc, plan) {
  const contingent = sum(inc.goals.filter(g => g.enabled && goalById(g.id).type === 'activity').map(g => g.amount));
  const participatory = sum(inc.goals.filter(g => g.enabled && goalById(g.id).type === 'preventive').map(g => g.amount));
  const coverage = PLANS[1].premium * 12; const ratio = (Math.min(contingent, inc.monthlyCap) * 12) / coverage;
  return { contingent, participatory, coverage, ratio, ok: ratio <= 0.3, warn: ratio > 0.22 };
}

      <div className="flex h-3 rounded-full overflow-hidden mt-5 gap-0.5">{segs.map(([l, v, c], i) => <div key={i} style={{ width: pct(v, total) + '%', background: c }} className="first:rounded-l-full last:rounded-r-full transition-all duration-700" />)}</div><div className="flex flex-wrap gap-x-4 gap-y-1.5 mt-3">{segs.map(([l, v, c], i) => <div key={i} className="flex items-center gap-1.5 text-xs text-slate-600"><div className="w-2 h-2 rounded-full" style={{ background: c }} />{l} <span className="tabular font-semibold text-slate-900">{fmtMoney(v)}</span></div>)}</div></Card>
    <div className="grid md:grid-cols-2 gap-4 mt-4"><Card className="p-5 rise" style={{ animationDelay: '80ms' }}><div className="flex items-center justify-between mb-3"><div className="font-semibold text-slate-900">Your plan</div><Chip tone="green">Active</Chip></div><div className="font-bold text-slate-900 text-lg tight">{plan.name}</div><div className="text-xs text-slate-400">{plan.carrier} · {plan.network} · {fmtMoney(plan.deductible)} deductible · {fmtMoney(plan.oop)} max</div>
      <div className="mt-4 space-y-2 text-sm"><Row l="Monthly premium" v={fmtMoney(plan.premium)} /><div className="flex items-center justify-between"><span className="text-slate-500">{company.name} pays</span><span className="tabular font-semibold text-brand-700">-{fmtMoney(company.plan.ichraMonthly)}</span></div>{employee.bonusRoute === 'premium' && <div className="flex items-center justify-between"><span className="text-slate-500">Rewards applied</span><span className="tabular font-semibold text-brand-700">-{fmtMoney(view.ev.earned)}</span></div>}<div className="flex items-center justify-between pt-2 border-t border-slate-100"><span className="font-semibold text-slate-900">You pay</span><span className={cx('tabular text-xl font-extrabold', afterBonus === 0 ? 'text-brand-700' : 'text-slate-900')}>{fmtMoney(afterBonus)}<span className="text-xs text-slate-400 font-medium">/mo</span></span></div></div>
      <div className="mt-4 text-[11px] text-slate-400">Open enrollment opens Nov 1. You can switch plans then or after a qualifying life event.</div></Card>
      <Card className="p-5 rise" style={{ animationDelay: '160ms' }}><div className="font-semibold text-slate-900 mb-3">Reimbursements</div>{reimb.length === 0 ? <div className="text-xs text-slate-400">Premiums, copays, prescriptions and deductibles are reimbursable from your plan contribution.</div> : <div className="space-y-2">{reimb.slice(0, 6).map(r => <div key={r.id} className="flex items-center gap-3 p-3 rounded-xl bg-slate-50"><div className="flex-1 min-w-0"><div className="text-sm font-semibold text-slate-900">{r.type}</div><div className="text-[11px] text-slate-400 truncate">{r.note || fmtDate(r.date)}</div></div><div className="text-right"><div className="tabular text-sm font-bold">{fmtMoney(r.amount)}</div><Chip tone={r.status === 'approved' ? 'green' : 'amber'}>{r.status}</Chip></div></div>)}</div>}</Card></div>
    <Modal open={open} onClose={() => setOpen(false)} title="Submit a reimbursement"><div className="space-y-4"><Select label="Type" value={f.type} onChange={e => setF({ ...f, type: e.target.value })}>{['Premium','Copay','Prescription','Deductible','Dental','Vision'].map(x => <option key={x}>{x}</option>)}</Select><div className="grid grid-cols-2 gap-3"><Input label="Amount" type="number" value={f.amount} onChange={e => setF({ ...f, amount: e.target.value })} placeholder="0.00" /><Input label="Date" type="date" value={f.date} max={iso(today())} onChange={e => setF({ ...f, date: e.target.value })} /></div><Input label="Note" value={f.note} onChange={e => setF({ ...f, note: e.target.value })} placeholder="e.g. Dermatology visit" /><div className="p-3 rounded-xl bg-slate-50 text-xs text-slate-500 flex items-center gap-2">{I.dl(14)} Receipt upload is simulated in this demo.</div><Button className="w-full" size="lg" onClick={submit}>Submit</Button></div></Modal></div>;
}
function EmpDevices({ company, employee }) {
  const toast = useToast(); const [connecting, setConnecting] = useState(null); const [syncing, setSyncing] = useState(false); const [confirm, setConfirm] = useState(false); const perms = employee.permissions || { sleep: true, hrv: true, activity: true, heart: true };
  const connect = id => { setConnecting(id); setTimeout(() => { _dailyCache.clear(); db.update('employees', employee.id, { deviceId: id, deviceConnectedAt: employee.deviceConnectedAt || iso(today()) }); db.log('device_connected', company.id, { name: employee.name, device: deviceById(id).name }); setConnecting(null); fireConfetti(60); toast(`${deviceById(id).name} connected. Backfilling 90 days.`); }, 1400); };
  const sync = () => { setSyncing(true); setTimeout(() => { setSyncing(false); toast(`Synced ${(900 + Math.floor(Math.random() * 600)).toLocaleString()} data points`); }, 1200); };
  return <div><PageHeader title="Devices" sub="Your wearable powers your habit rewards" />
    {employee.deviceId ? <Card className="p-6 rise"><div className="flex items-center gap-4"><div className="w-14 h-14 rounded-3xl bg-slate-900 text-white flex items-center justify-center text-2xl font-bold">{deviceById(employee.deviceId).glyph}</div><div className="flex-1"><div className="flex items-center gap-2"><span className="font-bold text-slate-900 text-lg tight">{deviceById(employee.deviceId).name}</span><Chip tone="green">{I.check(10)} Connected</Chip></div><div className="text-xs text-slate-400">Connected {fmtDateLong(employee.deviceConnectedAt || iso(today()))} · last sync {syncing ? 'now' : '2 hours ago'}</div></div><Button variant="secondary" size="sm" onClick={sync} disabled={syncing} icon={syncing ? <Spinner s={14} /> : I.refresh(14)}>{syncing ? 'Syncing' : 'Sync now'}</Button></div>
      <div className="mt-6"><div className="text-xs font-semibold text-slate-600 mb-2">Data permissions</div><div className="grid sm:grid-cols-2 gap-2">{[['sleep', 'Sleep duration and stages'], ['hrv', 'Heart-rate variability'], ['activity', 'Activity minutes and steps'], ['heart', 'Resting heart rate']].map(([k, l]) => <div key={k} className="flex items-center justify-between p-3 rounded-xl bg-slate-50"><span className="text-sm text-slate-700">{l}</span><Toggle on={perms[k]} onChange={v => { db.update('employees', employee.id, { permissions: { ...perms, [k]: v } }); toast(v ? 'Permission granted' : 'Permission revoked'); }} label={l} /></div>)}</div></div>
      <div className="mt-6 pt-5 border-t border-slate-100 flex items-center justify-between"><div className="text-xs text-slate-400">Disconnecting pauses habit rewards. Your history stays private and is deleted on request.</div>{!confirm ? <Button variant="ghost" size="sm" onClick={() => setConfirm(true)}>Disconnect</Button> : <div className="flex gap-2"><Button variant="danger" size="sm" onClick={() => { db.update('employees', employee.id, { deviceId: null }); setConfirm(false); toast('Device disconnected'); }}>Confirm</Button><Button variant="ghost" size="sm" onClick={() => setConfirm(false)}>Cancel</Button></div>}</div></Card>
      : <Card className="p-6 rise"><Empty icon={I.zap(24)} title="No device connected" body="Connect a wearable to unlock habit rewards. We backfill the last 90 days so you can see your trends right away." /></Card>}
    <h2 className="font-bold text-slate-900 tight mt-6 mb-3">{employee.deviceId ? 'Switch device' : 'Connect a device'}</h2><div className="space-y-2">{DEVICES.filter(d => d.id !== employee.deviceId).map((d, i) => <button key={d.id} onClick={() => connect(d.id)} disabled={!!connecting} className="w-full p-4 rounded-2xl border border-slate-200 bg-white hover:border-brand-300 flex items-center gap-4 text-left transition press rise" style={{ animationDelay: i * 50 + 'ms' }}><div className="w-11 h-11 rounded-2xl bg-slate-900 text-white flex items-center justify-center text-lg font-bold">{d.glyph}</div><div className="flex-1"><div className="font-semibold text-slate-900">{d.name}</div><div className="text-xs text-slate-400">{d.blurb}</div></div>{connecting === d.id ? <span className="text-brand-700"><Spinner /></span> : <span className="text-xs font-semibold text-brand-700">Connect</span>}</button>)}</div>
    <div className="mt-5 p-4 rounded-2xl bg-slate-50 flex items-start gap-3 text-xs text-slate-500">{I.lock(16)}<span><span className="font-semibold text-slate-700">Privacy by design.</span> Your individual data never leaves your account. {company.name} sees anonymized team-level trends with a minimum group size of 5. Data is encrypted at rest and deleted 90 days after you leave.</span></div></div>;
}
function EmpProfile({ user, company, employee, view, notes }) {
  const toast = useToast(); const [name, setName] = useState(employee.name); const [title, setTitle] = useState(employee.title || '');
  const all = db.where('notifications', n => n.companyId === company.id).sort((a, b) => b.at.localeCompare(a.at));
  return <div><PageHeader title="Profile" sub="Account, preferences and notifications" />
    <div className="grid md:grid-cols-2 gap-4"><Card className="p-6 rise"><div className="flex items-center gap-4 mb-5"><Avatar name={employee.name} size={56} /><div><div className="font-bold text-slate-900 text-lg tight">{employee.name}</div><div className="text-sm text-slate-500">{employee.title}</div><div className="flex items-center gap-2 mt-1"><Chip tone="amber" className="!bg-amber-100">{view.tier.name} tier</Chip><Chip tone="slate">{fmtMoney(view.lifetime)} lifetime</Chip></div></div></div><div className="space-y-3"><Input label="Name" value={name} onChange={e => setName(e.target.value)} /><Input label="Title" value={title} onChange={e => setTitle(e.target.value)} /><Input label="Email" value={user.email} disabled /><Button onClick={() => { db.update('employees', employee.id, { name, title }); db.update('users', user.id, { name }); toast('Profile updated'); }}>Save</Button></div></Card>
      <div className="space-y-4"><Card className="p-6 rise" style={{ animationDelay: '80ms' }}><div className="font-semibold text-slate-900 mb-1">Where your rewards go</div><div className="text-xs text-slate-400 mb-3">Applies to rewards earned from next month</div><div className="space-y-2">{[['wallet', 'Wellness wallet', 'Spend on fitness, recovery, therapy and more'], ['premium', 'Lower my premium', 'Applied against your share of the plan'], ['paycheck', 'Paycheck', 'Taxable cash in your next payroll']].map(([k, l, b]) => <button key={k} onClick={() => { db.update('employees', employee.id, { bonusRoute: k }); toast('Preference saved'); }} className={cx('w-full p-3 rounded-xl border-2 text-left transition press', employee.bonusRoute === k ? 'border-brand-500 bg-brand-50' : 'border-slate-200')}><div className="text-sm font-semibold text-slate-900">{l}</div><div className="text-[11px] text-slate-400">{b}</div></button>)}</div></Card>
        <Card className="p-6 rise" style={{ animationDelay: '160ms' }}><div className="font-semibold text-slate-900 mb-3">Notifications</div>{all.length === 0 ? <div className="text-xs text-slate-400">Nothing yet.</div> : <div className="space-y-2">{all.map(n => <div key={n.id} className="p-3 rounded-xl bg-slate-50"><div className="text-sm font-semibold text-slate-900">{n.title}</div><div className="text-[11px] text-slate-500">{n.body}</div></div>)}</div>}</Card></div></div>
    <div className="mt-6 flex items-center justify-between text-xs text-slate-400"><span>Member since {fmtDateLong(employee.joinedAt)}</span><button onClick={() => { session.clear(); navigate('/'); }} className="font-semibold text-slate-500 hover:text-slate-900 flex items-center gap-1">{I.logout(14)} Log out</button></div></div>;
}

/* ═══════════════════════════════════════════════════════════════════════
   ROOT
   ═══════════════════════════════════════════════════════════════════════ */
function App() {
  const route = useRoute(); const { user, company, employee } = useAuth();
  useEffect(() => { const s = document.getElementById('splash'); if (s) { s.style.opacity = '0'; setTimeout(() => s.remove(), 350); } }, []);
  useEffect(() => { if (!user) return; if (user.role === 'employer' && !route.startsWith('/employer')) navigate('/employer'); if (user.role === 'employee' && !route.startsWith('/me')) navigate('/me'); }, [user && user.id, route.split('/')[1]]);
  if (!user) { if (route === '/login') return <Login />; if (route === '/signup') return <Signup />; if (route === '/join') return <Join />; return <Landing />; }
  if (user.role === 'employer') { if (!company) { session.clear(); return <Landing />; } if (!company.onboarded) return <EmployerOnboarding user={user} company={company} />; return <EmployerApp user={user} company={company} route={route.startsWith('/employer') ? route : '/employer'} />; }
  if (!employee || !company) { session.clear(); return <Landing />; }
  if (!employee.onboarded) return <EmployeeOnboarding user={user} company={company} employee={employee} />;
  return <EmployeeApp user={user} company={company} employee={employee} route={route.startsWith('/me') ? route : '/me'} />;
}
if (!localStorage.getItem(DB_KEY)) seedDemo();
ReactDOM.createRoot(document.getElementById('root')).render(<ToastProvider><App /></ToastProvider>);
</script>
</body>
