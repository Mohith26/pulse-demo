  let met = 0, total = 0, end = addDays(today(), -1); const since = view.emp.deviceConnectedAt || '0000';
  for (let k = 0; k < n; k++) { const start = addDays(end, -6); if (iso(end) < since) break; const rows = view.daily.filter(d => d.date >= iso(start) && d.date <= iso(end) && d.date >= since); if (rows.length >= 5) { total++; if (act.some(g => metricForWeek(g, rows) >= g.threshold)) met++; } end = addDays(start, -1); }

}

  const goal = m.id === 'sleep' ? 'sleep' : m.id === 'active' ? 'exercise' : m.id === 'steps' ? 'steps' : m.source === 'lab' ? 'bloodwork' : null; const g = goal && view.ev.goals.find(x => x.id === goal);

    <div className="grid lg:grid-cols-3 gap-5">
      <Card className="p-6 md:p-8 lg:col-span-2"><div className="flex items-start justify-between gap-4"><div><div className="serif text-[40px] md:text-[48px] leading-[1.05] text-ink">{m.name}{m.short && m.short !== m.name && <span className="text-ink3"> ({m.short})</span>}</div><div className="flex items-baseline gap-3 mt-3"><span className="text-[40px] font-light text-ink tabular leading-none">{m.id === 'steps' ? m.value.toLocaleString() : m.value}</span><span className="text-[15px] text-ink3">{m.unit}</span><StatusPill status={m.status} size="md" /></div>{tw && <div className="text-[13.5px] text-ink2 mt-2">{tw[0].toUpperCase() + tw.slice(1)}</div>}</div></div>
        <div className="mt-6">{m.source === 'lab' ? <RangeLadder m={m} height={250} /> : <><AreaChart data={m.hist.map(h => h.value)} labels={m.hist.map(h => fmtDate(h.date))} color={STATUS_META[m.status].color} height={210} fmt={v => m.dec ? v.toFixed(m.dec) : Math.round(v).toLocaleString()} /><div className="mt-5"><RangeBar m={m} showLabels height={7} /></div></>}</div>
      </Card>
      <div className="space-y-5">
        <Card className="p-6"><Label>What it is</Label><p className="text-[14.5px] text-ink2 mt-2 leading-relaxed">{m.desc}</p></Card>
        <Card className="p-6"><Label>What this means for you</Label><p className="text-[14.5px] text-ink2 mt-2 leading-relaxed">{meaning}</p><div className="mt-4 divide-line">{ranges.map(([l, r, st]) => <div key={l} className="flex justify-between py-2 text-[13px]"><StatusPill status={st}>{l}</StatusPill><span className="tabular text-ink">{r} <span className="text-ink3">{m.unit}</span></span></div>)}</div></Card>
        {g && <Card className="p-6"><Label>Reward</Label><p className="text-[14px] text-ink2 mt-2">{g.type === 'activity' ? `This feeds your ${g.short.toLowerCase()} goal: ${fmtMoney(g.amount)} a month.` : g.done ? `Bloodwork reward earned (${fmtMoney(g.amount)}).` : `Your next panel earns ${fmtMoney(g.amount)} and is covered by your plan.`}</p></Card>}
      </div>
    </div>
    {sp && <ProtocolSuggestCard p={sp} />}
    {m.hist && m.hist.length > 0 && <><h2 className="serif text-[26px] text-ink mt-10 mb-3">History</h2><Card className="divide-line overflow-hidden">{[...m.hist].reverse().slice(0, 8).map((h, i) => <div key={i} className="flex justify-between items-center px-6 py-3 text-[14px]"><span className="text-ink2">{m.source === 'lab' ? fmtDateLong(h.date) : 'Week of ' + fmtDate(h.date)}</span><span className="flex items-center gap-4"><StatusPill status={markerStatus(h.value, m)} /><span className="tabular text-ink w-20 text-right">{m.dec ? (+h.value).toFixed(m.dec) : Math.round(h.value).toLocaleString()} <span className="text-ink3 text-[12px]">{m.unit}</span></span></span></div>)}</Card></>}
  </>;
}

/* ─── PROTOCOLS (Superpower) ─── */
function startProtocol(emp, key) { const ex = db.find('protocols', p => p.employeeId === emp.id && p.key === key && p.status === 'active'); if (ex) return; db.insert('protocols', { id: uid(), employeeId: emp.id, key, status: 'active', startedAt: iso(today()), checks: {} }); db.log('protocol_started', emp.companyId, { title: PROTOCOL_LIB[key].title.toLowerCase() }); }
function ProtocolSuggestCard({ p }) {
  const { employee, view } = useEmp(); const toast = useToast(); const active = protocolsFor(employee).some(x => x.key === p.key && x.status === 'active');
  const rw = p.reward.goal ? view.ev.goals.find(g => g.id === p.reward.goal) : null;
  return <Card className="p-6 md:p-8 mt-5"><div className="flex flex-wrap items-center gap-2"><span className="inline-flex items-center gap-1.5 text-[12px] font-medium px-2.5 py-1 rounded-full" style={{ background: p.priority === 'High priority' ? 'var(--bad-soft)' : 'var(--watch-soft)', color: p.priority === 'High priority' ? 'var(--bad)' : 'var(--watch)' }}><span className="dot" style={{ background: 'currentColor' }} />{p.priority}</span><span className="text-[12.5px] text-ink3">{p.weeks < 4 ? `${p.weeks} weeks` : `${p.weeks} weeks`} to see a change</span></div>
    <div className="serif text-[32px] leading-tight text-ink mt-3">{p.title}</div>
    <div className="grid md:grid-cols-3 gap-6 mt-6">
      <div><Label>How you might be feeling</Label><div className="flex flex-wrap gap-1.5 mt-3">{p.feeling.map(f => <span key={f} className="text-[12.5px] px-2.5 py-1 rounded-full bg-bg2 text-ink2">{f}</span>)}</div></div>
      <div><Label>Affected markers</Label><div className="mt-3 space-y-3">{p.affected.map(m => <a key={m.id} href={'#/me/metric/' + m.id} className="block"><div className="flex justify-between text-[13px]"><span className="text-ink">{m.short || m.name}</span><span className="tabular" style={{ color: STATUS_META[m.status].color }}>{m.value} <span className="text-ink3">{m.unit}</span></span></div><div className="mt-1"><RangeBar m={m} height={4} /></div></a>)}</div></div>
      <div><Label>What to do</Label><ol className="mt-3 space-y-3">{p.recs.map((r, i) => <li key={i} className="flex gap-2.5"><span className="mono text-[11px] text-accent mt-0.5">0{i + 1}</span><div><div className="text-[13.5px] text-ink">{r.t}</div><div className="text-[12px] text-ink3">{r.d}</div></div></li>)}</ol></div>
    </div>
    <div className="flex flex-wrap items-center justify-between gap-3 mt-7 pt-5 border-t border-line"><div className="text-[13px] text-ink2">{rw ? <>Supports your <b className="text-ink font-medium">{rw.short.toLowerCase()}</b> reward ({fmtMoney(rw.amount)})</> : p.reward.perk ? <>Uses your wellness wallet for {MARKET[p.reward.perk].name.toLowerCase()}</> : null}</div>{active ? <Button variant="soft" size="sm" icon={I.check(14)} onClick={() => navigate('/me/protocols')}>In progress</Button> : <Button variant="primary" onClick={() => { startProtocol(employee, p.key); toast('Protocol started. Day 1 is today.'); fireConfetti(60); }}>Start protocol</Button>}</div>
  </Card>;
}
function ProtocolChecklist({ p, compact }) {
  const lib = PROTOCOL_LIB[p.key]; const t = iso(today()); const toast = useToast();
  const toggle = i => { const checks = { ...(p.checks || {}) }; const arr = new Set(checks[i] || []); arr.has(t) ? arr.delete(t) : arr.add(t); checks[i] = [...arr]; db.update('protocols', p.id, { checks }); const all = lib.recs.every((_, j) => (j === i ? arr : new Set(checks[j] || [])).has(t)); if (all) { toast('All done for today. Nice.'); fireConfetti(50); } };
  return <div className={cx('space-y-2', compact ? 'mt-4' : 'mt-5')}>{lib.recs.map((r, i) => { const done = (p.checks?.[i] || []).includes(t); return <div key={i} className="flex items-center gap-3"><button onClick={() => toggle(i)} role="checkbox" aria-checked={done} aria-label={r.t} className="w-6 h-6 rounded-full border-[1.5px] flex items-center justify-center flex-shrink-0 transition focus-ring" style={{ borderColor: done ? 'var(--good)' : 'var(--line2)', background: done ? 'var(--good)' : 'transparent', color: '#fff' }}>{done && I.check(12)}</button><div className="flex-1 min-w-0"><div className={cx('text-[14px]', done ? 'text-ink3 line-through' : 'text-ink')}>{r.t}</div>{!compact && <div className="text-[12px] text-ink3">{r.d}</div>}</div>{r.action && !done && <button onClick={() => navigate('/me/wallet/' + r.action)} className="text-[12.5px] text-accent font-medium whitespace-nowrap">Open {I.arrowR(12)}</button>}</div>; })}</div>;
}
function EmpProtocols() {
  const { hm, employee } = useEmp(); const mine = protocolsFor(employee); const active = mine.filter(p => p.status === 'active'); const done = mine.filter(p => p.status === 'done');
  const sugg = suggestedProtocols(hm).filter(p => !active.some(a => a.key === p.key)); const toast = useToast();
  return <><PageHead title="Protocols" sub="Short action plans built from your data. Built on clinical guidelines; not a substitute for your doctor." />
    {active.length > 0 && <><Label className="mb-3">In progress</Label><div className="grid md:grid-cols-2 gap-4 mb-8">{active.map(p => { const lib = PROTOCOL_LIB[p.key]; const pr = protocolProgress(p); return <Card key={p.id} className="p-6"><div className="flex items-center justify-between"><span className="text-[12.5px] text-ink3 tabular">Day {pr.day} of {pr.total} · {Math.round(pr.adherence * 100)}% done so far</span><button onClick={() => { db.update('protocols', p.id, { status: 'done', endedAt: iso(today()) }); toast('Protocol complete. Pulse will check your markers.'); }} className="text-[12.5px] text-ink2 hover:text-ink">Mark complete</button></div><div className="serif text-[26px] text-ink mt-2">{lib.title}</div><div className="mt-3"><Progress value={pr.pct} color="var(--accent)" h={5} /></div><Label className="mt-5">Today</Label><ProtocolChecklist p={p} /></Card>; })}</div></>}
    {sugg.length > 0 ? <><Label className="mb-1">Suggested for you</Label>{sugg.map(p => <ProtocolSuggestCard key={p.key} p={p} />)}</> : <Card><Empty icon="check" title="Nothing to fix right now" body="Every marker Pulse tracks is in range. New protocols appear automatically if something slips." /></Card>}
    {done.length > 0 && <><Label className="mt-10 mb-3">Completed</Label><Card className="divide-line">{done.map(p => <div key={p.id} className="flex justify-between px-6 py-3.5 text-[14px]"><span className="text-ink">{PROTOCOL_LIB[p.key].title}</span><span className="text-ink3">{fmtDate(p.endedAt)}</span></div>)}</Card></>}
  </>;
}

/* ─── REWARDS (goals) ─── */

  return <><PageHead title="Rewards" sub={`Paid by ${company.name}. Verified automatically from your wearable and claims.`} />
    <div className="grid lg:grid-cols-3 gap-5">
      <Card className="p-6 md:p-7"><Label>{monthName()}</Label><div className="flex items-baseline gap-2 mt-2"><span className="text-[52px] font-light text-ink tabular leading-none">{fmtMoney(ev.earned)}</span><span className="text-ink3">of {fmtMoney(ev.possible)}</span></div><div className="mt-4"><Progress value={pct(ev.earned, ev.possible)} color="var(--accent)" h={6} /></div>{ev.recovery && <div className="mt-4 text-[13px] p-3 rounded-xl" style={{ background: 'var(--good-soft)', color: 'var(--good)' }}>Recovery week is on. Activity targets are 40% lower.</div>}<div className="grid grid-cols-2 gap-3 mt-5"><div className="card-sunk p-3"><div className="text-[20px] tabular text-ink">{fmtMoney(view.lifetime)}</div><div className="text-[11.5px] text-ink3">Lifetime</div></div><div className="card-sunk p-3"><div className="text-[20px] text-ink">{tier.name}</div><div className="text-[11.5px] text-ink3">{next ? `${fmtMoney(next.min - view.lifetime)} to ${next.name}` : 'Top tier'}</div></div></div></Card>

    </div>
    <h2 className="serif text-[28px] text-ink mt-10 mb-4">Weekly habits</h2>
    <div className="space-y-4">{ev.goals.filter(g => g.type === 'activity').map(g => <Card key={g.id} className="p-6"><div className="flex items-start gap-4"><IconTile n={GOAL_ICON[g.id]} size={42} /><div className="flex-1 min-w-0"><div className="flex items-start justify-between gap-3"><div><div className="text-[16px] text-ink">{g.name}</div><div className="text-[13px] text-ink3">{fmtMoney(g.amount)}/month · {fmtMoney(Math.round(g.amount / Math.max(1, g.weeks.length)))} per week met</div></div><div className="text-right"><div className="text-[18px] tabular text-ink">{fmtMoney(g.earned)}</div><div className="text-[11.5px] text-ink3">this month</div></div></div>

    <h2 className="serif text-[28px] text-ink mt-10 mb-4">Preventive care</h2>
    <Card className="divide-line">{ev.goals.filter(g => g.type === 'preventive').map(g => <div key={g.id} className="flex items-center gap-4 px-6 py-4"><IconTile n={GOAL_ICON[g.id]} size={38} tone={g.done ? 'good' : undefined} /><div className="flex-1"><div className="text-[15px] text-ink">{g.name}</div><div className="text-[12.5px] text-ink3">{g.done ? `Done ${fmtDate(g.done.date)} · verified by ${{ claims: 'claims match', document: 'document', attest: 'self-report' }[g.done.method] || g.done.method}` : g.desc}</div></div><span className="tabular text-[14px] text-ink mr-2">{fmtMoney(g.amount)}</span>{g.done ? <StatusPill status="done" /> : <Button size="sm" variant="secondary" onClick={() => setVerify(g)}>Mark done</Button>}</div>)}</Card>

/* ─── WALLET (with Ramp "is this in policy?") ─── */
function EmpWallet({ cat }) {

  const tx = db.where('transactions', t => t.employeeId === employee.id).sort((a, b) => b.date.localeCompare(a.date));
  const check = e => { e.preventDefault(); if (!q.trim()) return; const r = eligibility(q); setAns(r ? r : { unknown: true }); };
  const disc = TIER_DISCOUNT[view.tier.name] || 0; const priceOf = it => it.covered ? 0 : Math.round(it.price * (1 - disc));
  const book = it => { const p = priceOf(it); if (p > wallet.balance) return toast('Not enough in your wallet this month', 'error'); db.insert('transactions', { id: uid(), employeeId: employee.id, vendor: it.vendor, category: buy.cat, description: it.desc, amount: p, date: iso(today()), meals: it.meals || 0 }); it = { ...it, price: p }; if (buy.cat === 'bloodwork' && !view.ev.goals.find(g => g.id === 'bloodwork')?.done) { toast('Draw booked. Results land in My Health.'); } else toast(`Booked: ${it.vendor}. ${fmtMoney(it.price)} paid from your wallet.`); setBuy(null); };
  if (cat && MARKET[cat]) { const m = MARKET[cat]; return <><BackLink to="/me/wallet" label="Wallet" /><PageHead title={m.name} sub={`${m.blurb} · ${fmtMoney(wallet.balance)} available · Pulse group rates${disc ? `, plus ${Math.round(disc * 100)}% off as a ${view.tier.name} member` : ''}`} />{cat === 'mental' && <Card className="p-5 mb-4 flex items-center gap-4" onClick={() => navigate('/me/care')}><IconTile n="brain" size={40} tone="accent" /><div className="flex-1"><div className="text-[15px] text-ink">Find a therapist or coach</div><div className="text-[13px] text-ink3">Vetted, booked in two taps, {fmtMoney(THERAPY_COPAY)} a session</div></div><span className="text-ink3">{I.chevR(16)}</span></Card>}<Card className="divide-line">{m.items.map((it, i) => <div key={i} className="flex items-center gap-4 px-6 py-4"><IconTile n={CAT_ICON[cat]} size={40} /><div className="flex-1"><div className="text-[15px] text-ink">{it.vendor}</div><div className="text-[13px] text-ink3">{it.desc}{it.score && <span className="ml-2 text-[11px] px-1.5 py-0.5 rounded-md" style={{ background: 'var(--good-soft)', color: 'var(--good)' }}>Nutrition {it.score} · {it.meals} {it.meals === 1 ? 'meal' : 'meals'}</span>}</div></div><span className="tabular text-[15px] text-ink mr-2 text-right">{it.list ? <s className="text-[12px] text-ink3 mr-1.5">{fmtMoney(it.list)}</s> : null}{it.covered ? 'Covered' : fmtMoney(priceOf(it))}</span><Button size="sm" variant={it.covered ? 'accent' : 'secondary'} onClick={() => setBuy({ ...it, cat })}>{it.covered ? 'Book' : 'Buy'}</Button></div>)}</Card>
    <Modal open={!!buy} onClose={() => setBuy(null)} title={buy ? buy.vendor : ''}>{buy && <><p className="text-[14px] text-ink2">{buy.desc}</p><div className="card-sunk mt-5 px-4">{buy.list ? <Row l="List price" v={<s className="text-ink3">{fmtMoney(buy.list)}</s>} /> : null}<Row l={disc && !buy.covered ? `Your price (${view.tier.name})` : 'Your price'} v={buy.covered ? 'Covered by your plan' : fmtMoney(priceOf(buy))} /><Row l="Wallet after" v={fmtMoney(wallet.balance - priceOf(buy))} bold /></div><Button className="w-full mt-5" size="lg" variant="accent" onClick={() => book(buy)}>{buy.covered ? (buy.cat === 'bloodwork' ? 'Book a draw' : 'Book') : `Pay ${fmtMoney(priceOf(buy))} from wallet`}</Button></>}</Modal></>; }
  return <><PageHead title="Wellness wallet" sub={`Funded by ${company.name} on the 1st, topped up by what you earn`} />
    <div className="grid lg:grid-cols-3 gap-5">
      <Card className="p-6 md:p-7 lg:col-span-2"><Label>Available in {monthName()}</Label><div className="text-[52px] font-light text-ink mt-1 leading-none"><Money v={wallet.balance} /></div><div className="mt-6"><SegBar parts={[{ label: `${company.name}`, v: wallet.allowance, c: 'var(--ink)', showV: true }, { label: 'Your rewards', v: wallet.bonus, c: 'var(--accent)', showV: true }, { label: 'Spent', v: wallet.spent, c: 'var(--line2)', showV: true }]} /></div></Card>
      <Card className="p-6"><Label>Is this covered?</Label><form onSubmit={check} className="mt-3 flex gap-2"><input value={q} onChange={e => { setQ(e.target.value); setAns(null); }} placeholder="e.g. a massage, running shoes" className="field flex-1 !rounded-full !py-2 !text-[13.5px]" aria-label="What do you want to buy?" /><Button size="sm" type="submit">Check</Button></form>

        : <Card className="divide-line overflow-hidden">{tx.length ? tx.map(t => <div key={t.id} className="flex items-center gap-4 px-6 py-3.5"><IconTile n={CAT_ICON[t.category] || 'card'} size={36} /><div className="flex-1"><div className="text-[14.5px] text-ink">{t.vendor}</div><div className="text-[12.5px] text-ink3">{t.description}</div></div><span className="text-[12.5px] text-ink3 mr-3">{fmtDate(t.date)}</span><span className="tabular text-[14.5px] text-ink">{'−'}{fmtMoney(t.amount)}</span></div>) : <Empty icon="wallet" title="No purchases yet" body="Anything you buy with your wallet shows up here." />}</Card>}
    </Tabs></div></>;

/* ─── BENEFITS ─── */

        : <Card className="divide-line overflow-hidden">{reimb.length ? reimb.map(r => <div key={r.id} className="flex items-center gap-4 px-6 py-3.5"><IconTile n="receipt" size={36} /><div className="flex-1"><div className="text-[14.5px] text-ink">{r.type}</div><div className="text-[12.5px] text-ink3">{r.note || '—'} · {fmtDate(r.date)}</div></div>{r.by === 'auto' && <span className="text-[11.5px] text-ink3 mr-2 hidden sm:inline">Auto-approved</span>}<StatusPill status={r.status === 'approved' ? 'optimal' : r.status === 'declined' ? 'out' : 'watch'}>{r.status === 'approved' ? 'Approved' : r.status === 'declined' ? 'Declined' : 'In review'}</StatusPill><span className="tabular text-[14.5px] text-ink w-16 text-right">{fmtMoney(r.amount)}</span></div>) : <Empty icon="receipt" title="No reimbursements" body="Copays, prescriptions and premiums you paid yourself." />}</Card>}

  </>;
}

/* ─── ONBOARDING (personalized) ─── */
function EmployeeOnboarding({ user, company, employee }) {
  const [step, setStep] = useState(0); const [focus, setFocus] = useState(['sleep', 'stress']); const [tone, setTone] = useState('coach'); const [device, setDevice] = useState(null); const enabled = company.incentives.goals.filter(g => g.enabled).map(g => g.id); const [goals, setGoals] = useState(enabled); const [plan, setPlan] = useState('silver'); const [types, setTypes] = useState({ sleep: true, hrv: true, activity: true, heart: true }); const [agree, setAgree] = useState(false);
  const steps = ['Welcome', 'Focus', 'Voice', 'Device', 'Consent', 'Goals', 'Plan'];
  const finish = () => { db.update('users', user.id, { prefs: { ...userPrefs(user), focus, tone } }); const fresh = db.find('employees', e => e.id === employee.id); db.update('employees', employee.id, { onboarded: true, deviceId: device || fresh.deviceId || null, deviceConnectedAt: device || fresh.deviceId ? iso(today()) : null, goals, planId: plan, permissions: types, consent: { version: '2026-10', at: iso(today()), types } }); audit(company.id, employee.name, 'Signed data consent', employee.id, 'version 2026-10'); if (device) db.log('device_connected', company.id, { name: employee.name, device: deviceById(device).name }); db.log('employee_onboarded', company.id, { name: employee.name }); fireConfetti(); navigate('/me'); };
  const next = () => step < steps.length - 1 ? setStep(step + 1) : finish();
  const body = [
    <><h1 className="serif text-[44px] leading-tight text-ink">Hi {user.name.split(' ')[0]}. <em className="text-accent">Welcome to Pulse.</em></h1><p className="text-[16px] text-ink2 mt-4 leading-relaxed">{company.name} gives you {fmtMoney(company.plan.ichraMonthly)}/month toward a health plan you pick, a {fmtMoney(company.plan.walletMonthly)} wellness wallet, and rewards for sleeping and moving well. Two minutes to set up.</p></>,
    <><h1 className="serif text-[40px] leading-tight text-ink">What do you care about most?</h1><p className="text-[15px] text-ink2 mt-2">Pick any. Pulse leads with these.</p><div className="grid grid-cols-2 gap-3 mt-6">{FOCUS_OPTIONS.map(o => { const on = focus.includes(o.id); return <button key={o.id} onClick={() => setFocus(on ? focus.filter(x => x !== o.id) : [...focus, o.id])} aria-pressed={on} className="text-left p-5 rounded-2xl border-[1.5px] transition focus-ring" style={{ borderColor: on ? 'var(--ink)' : 'var(--line)', background: on ? 'var(--surface)' : 'transparent' }}><div className="text-[15px] text-ink font-medium">{o.label}</div><div className="text-[12.5px] text-ink3 mt-0.5">{o.sub}</div></button>; })}</div></>,
    <><h1 className="serif text-[40px] leading-tight text-ink">How should Pulse talk to you?</h1><p className="text-[15px] text-ink2 mt-2">You can change this any time. Tap to hear it.</p><div className="space-y-3 mt-6">{TONES.map(t => <button key={t.id} onClick={() => { setTone(t.id); speak(t.sample); }} aria-pressed={tone === t.id} className="w-full text-left p-5 rounded-2xl border-[1.5px] transition focus-ring flex items-start gap-4" style={{ borderColor: tone === t.id ? 'var(--ink)' : 'var(--line)', background: tone === t.id ? 'var(--surface)' : 'transparent' }}><span className="mt-1 text-accent">{I.speaker(18)}</span><div><div className="text-[15px] text-ink font-medium">{t.label}</div><div className="serif text-[18px] text-ink2 mt-1">“{t.sample}”</div></div></button>)}</div></>,
    <><h1 className="serif text-[40px] leading-tight text-ink">Connect a wearable</h1><p className="text-[15px] text-ink2 mt-2">Pulse reads sleep, heart and activity. Never location, messages or contacts.</p><div className="grid sm:grid-cols-2 gap-3 mt-6">{DEVICES.map(d => <button key={d.id} onClick={() => setDevice(d.id)} aria-pressed={device === d.id} className="text-left p-4 rounded-2xl border-[1.5px] transition focus-ring flex items-center gap-3" style={{ borderColor: device === d.id ? 'var(--ink)' : 'var(--line)', background: device === d.id ? 'var(--surface)' : 'transparent' }}><IconTile n="watch" size={36} tone={device === d.id ? 'good' : undefined} /><div><div className="text-[14.5px] text-ink">{d.name}</div><div className="text-[12px] text-ink3">{d.blurb}</div></div></button>)}</div><div className="mt-5"><DataImportCard employee={db.find('employees', e => e.id === employee.id)} company={company} onDone={() => setDevice('apple')} /></div><button onClick={() => { setDevice(null); next(); }} className="text-[13.5px] text-ink3 hover:text-ink mt-4">I’ll do this later</button></>,
    <ConsentStep types={types} setTypes={setTypes} agree={agree} setAgree={setAgree} company={company} />,
    <><h1 className="serif text-[40px] leading-tight text-ink">Pick your goals</h1><p className="text-[15px] text-ink2 mt-2">Up to {fmtMoney(company.incentives.monthlyCap)} a month. You can change these monthly.</p><div className="space-y-2.5 mt-6">{enabled.map(id => { const g = goalById(id); const c = company.incentives.goals.find(x => x.id === id); const on = goals.includes(id); return <button key={id} onClick={() => setGoals(on ? goals.filter(x => x !== id) : [...goals, id])} aria-pressed={on} className="w-full text-left p-4 rounded-2xl border-[1.5px] transition focus-ring flex items-center gap-3" style={{ borderColor: on ? 'var(--ink)' : 'var(--line)', background: on ? 'var(--surface)' : 'transparent' }}><IconTile n={GOAL_ICON[id]} size={36} /><div className="flex-1"><div className="text-[14.5px] text-ink">{g.name}</div><div className="text-[12px] text-ink3">{g.type === 'activity' ? 'Weekly, from your wearable' : 'Once a year'}</div></div><span className="tabular text-[14px] text-ink">{fmtMoney(c.amount)}{g.type === 'activity' ? '/mo' : ''}</span></button>; })}</div></>,
    <><h1 className="serif text-[40px] leading-tight text-ink">Choose your plan</h1><p className="text-[15px] text-ink2 mt-2">{company.name} contributes {fmtMoney(company.plan.ichraMonthly)}/month. The plan is yours and goes with you.</p><div className="space-y-2.5 mt-6">{PLANS.map(p => <button key={p.id} onClick={() => setPlan(p.id)} aria-pressed={plan === p.id} className="w-full text-left p-4 rounded-2xl border-[1.5px] transition focus-ring flex items-center gap-4" style={{ borderColor: plan === p.id ? 'var(--ink)' : 'var(--line)', background: plan === p.id ? 'var(--surface)' : 'transparent' }}><div className="flex-1"><div className="text-[15px] text-ink">{p.name} <span className="text-[12px] text-ink3 ml-1">{p.tag}</span></div><div className="text-[12.5px] text-ink3">{p.carrier} · {fmtMoney(p.deductible)} deductible</div></div><div className="text-right"><div className="tabular text-[16px] text-ink">{fmtMoney(Math.max(0, p.premium - company.plan.ichraMonthly))}</div><div className="text-[11px] text-ink3">you pay /mo</div><div className="text-[11px]" style={{ color: 'var(--good)' }}>+ up to {fmtMoney(company.incentives.monthlyCap)} rewards</div></div></button>)}</div></>,
  ][step];
  useEffect(() => { const k = e => { if (e.key === 'Enter' && document.activeElement.tagName !== 'TEXTAREA' && !((step === 1 && !focus.length) || (step === 3 && !device) || (step === 4 && !agree))) { e.preventDefault(); next(); } }; window.addEventListener('keydown', k); return () => window.removeEventListener('keydown', k); });
  return <div className="min-h-screen bg-bg flex flex-col"><header className="max-w-2xl w-full mx-auto px-6 h-20 flex items-center justify-between"><Logo /><div className="flex items-center gap-3"><span className="label">Step {String(step + 1).padStart(2, '0')} · {steps[step]}</span></div></header><div className="max-w-2xl w-full mx-auto px-6"><div className="flex gap-1.5">{steps.map((_, i) => <div key={i} className="flex-1 h-1 rounded-full transition-all" style={{ background: i <= step ? 'var(--accent)' : 'var(--line)' }} />)}</div></div>
    <main className="flex-1 max-w-2xl w-full mx-auto px-6 py-10 fade-in" key={step}>{body}</main>
    <footer className="max-w-2xl w-full mx-auto px-6 pb-10 flex items-center justify-between">{step > 0 ? <Button variant="ghost" onClick={() => setStep(step - 1)} icon={I.chevL(15)}>Back</Button> : <span />}<Button size="lg" variant={step === steps.length - 1 ? 'accent' : 'primary'} disabled={(step === 1 && !focus.length) || (step === 3 && !device) || (step === 4 && !agree)} onClick={next} iconRight={step < steps.length - 1 ? I.arrowR(16) : null}>{step === steps.length - 1 ? 'Finish' : 'Continue'}</Button></footer></div>;
}

/* ─── NEEDS YOU (Mercury Tasks) ─── */
function ErInbox() {
  const { company, stats, items } = useEr(); const toast = useToast(); const [tab, setTab] = useState('open'); const auto = automationStats(company);
  const done = db.where('decisions', d => d.companyId === company.id).sort((a, b) => b.at.localeCompare(a.at));
  const act = (it, primary) => {
    const k = it.kind;
    if (k === 'reimbursement') { db.update('reimbursements', it.ref.id, { status: primary ? 'approved' : 'declined', by: 'admin' }); toast(primary ? `Approved ${fmtMoney(it.ref.amount)}` : 'Declined. They’ll get a note with the reason.'); }
    if (k === 'ras') { db.update('rasRequests', it.ref.id, { status: primary ? 'approved' : 'info' }); toast(primary ? 'Alternative approved' : 'Asked for a doctor’s note'); }
    if (k === 'signal') { if (primary) { setRecovery(company, true); toast('Recovery week on'); } else toast('Dismissed for this month'); }
    if (k === 'invite') { if (primary) { db.update('invites', it.ref.id, { createdAt: iso(today()) }); toast('Invite resent'); } }
    if (k === 'hire') { const hires = (company.payroll.pendingHires || []).filter(h => h.email !== it.ref.email); if (primary) { createInvite(company, it.ref); toast(`Invited ${it.ref.name}`); } db.update('companies', company.id, { payroll: { ...company.payroll, pendingHires: hires } }); }
    if (k === 'compliance') { navigate('/employer/program'); return; }
    if (k === 'share') toast('Acknowledged. They’ll see you read it.');
    if (k === 'termination') { const pend = (company.payroll.pendingTerminations || []).filter(t => t.employeeId !== it.ref.employeeId); if (primary) { const e = db.find('employees', x => x.id === it.ref.employeeId); if (e) { offboard(company, e, { actor: adminName(company) }); toast(`${e.name} offboarded`); } } db.update('companies', company.id, { payroll: { ...company.payroll, pendingTerminations: pend } }); }
    decide(it.key, primary ? 'approved' : 'dismissed', company.id);
  };
  const reimbs = items.filter(i => i.kind === 'reimbursement');
  return <><ErTitle title="Needs you" sub="Only what actually needs a human. Everything else, Pulse handled." right={reimbs.length > 1 && <Button size="sm" variant="secondary" onClick={() => { reimbs.forEach(i => act(i, true)); }}>Approve all {reimbs.length} reimbursements</Button>} />

    <div className="grid grid-cols-3 gap-3 md:gap-5 mb-6">{[['Actions this month', st.actions], ['Hours saved', st.hours], ['Rules on', Object.values(a).filter(x => x.on).length + ' of ' + Object.keys(a).length]].map(([l, v]) => <Card key={l} className="p-5"><div className="text-[13px] text-ink2">{l}</div><div className="text-[28px] md:text-[32px] text-ink tabular mt-1" style={{ fontWeight: 400 }}>{v}</div></Card>)}</div>

        {k === 'nudge' && <label className="flex items-center gap-2 text-[13.5px] text-ink2">After<span className="flex items-center gap-1 border border-line2 rounded-lg px-2.5 h-8"><input type="number" value={a.nudge.days} onChange={e => set('nudge', { days: clamp(+e.target.value || 1, 1, 30) })} className="w-8 bg-transparent outline-none tabular text-ink" aria-label="Nudge after days" /></span>days</label>}
        {k === 'recovery' && <Segmented label="Recovery mode" value={a.recovery.mode} onChange={v => set('recovery', { mode: v })} options={[{ value: 'ask', label: 'Ask me first' }, { value: 'auto', label: 'Automatic' }]} />}
        {k === 'digest' && <Segmented label="Digest channel" value={a.digest.channel || 'email'} onChange={v => set('digest', { channel: v })} options={[{ value: 'email', label: 'Email' }, { value: 'voice', label: 'Voice + email' }, { value: 'slack', label: 'Slack' }]} />}
        <span className="text-[12.5px] text-ink3">{st.by[k] || 0} {m.verb} this month · last ran {lastRun(k)}</span>
        {runNow[k] && <Button size="sm" variant="secondary" className="ml-auto" onClick={runNow[k][1]}>{runNow[k][0]}</Button>}
      </div>}</div></div></Card>)}</div>
    <h2 className="text-[20px] text-ink mt-10 mb-4" style={{ fontWeight: 450 }}>Run log</h2>

    <DigestModal open={digest} onClose={() => setDigest(false)} />
  </>;
}
function digestText(company, stats, user) { const st = automationStats(company); const items = needsYou(company, stats); const ps = programScore(stats); return `Good morning, ${user.name.split(' ')[0]}. Here is your Pulse week. Program score is ${ps.score}, ${ps.label.toLowerCase()}. ${stats.connected.length} of ${stats.active.length} people are connected and ${Math.round(stats.earningRate * 100)} percent earned a reward this month. Pulse took ${st.actions} actions for you and saved about ${st.hours} hours. ${items.length ? `${items.length} things need you, starting with: ${stripHtml(items[0].html)}.` : 'Nothing needs you.'} ${stats.flagged.length >= 3 ? `Heads up: ${stats.flagged.length} people show a simultaneous decline in sleep and recovery.` : 'Team health is steady.'}`; }
function DigestModal({ open, onClose }) { const { company, stats, user } = useEr(); const txt = digestText(company, stats, user); useEffect(() => () => stopSpeaking(), []); return <Modal open={open} onClose={() => { stopSpeaking(); onClose(); }} title="Monday digest"><div className="text-[12.5px] text-ink3 mb-3">Preview of what lands in your inbox{(company.automations.digest.channel === 'voice') ? ' and plays as audio' : ''} every Monday at 8am.</div><div className="card-sunk p-5 text-[14.5px] text-ink2 leading-relaxed">{txt}</div><div className="mt-4"><SpeakButton text={txt} label="Listen" /></div></Modal>; }

/* ─── INSIGHTS (Mercury Insights layout) ─── */
function ErInsights() {
  const { company, stats } = useEr(); const toast = useToast(); const [metric, setMetric] = useState('sleep'); const ps = programScore(stats); const roi = roiModel(stats, company);
  useEffect(() => { audit(company.id, adminName(company), 'Viewed team insights (aggregate)', null, ''); }, []);
  const W = stats.weeks; const first = W[0], last = W[W.length - 1];
  const S = { sleep: { label: 'Avg sleep', data: W.map(w => +w.sleep.toFixed(2)), fmt: v => v.toFixed(2) + 'h' }, hrv: { label: 'Avg HRV', data: W.map(w => Math.round(w.hrv)), fmt: v => Math.round(v) + ' ms' }, exercise: { label: 'Active min/wk', data: W.map(w => Math.round(w.exercise)), fmt: v => Math.round(v) + ' min' }, adoption: { label: 'Adoption', data: stats.months.map(m => Math.round(m.rate * 100)), fmt: v => Math.round(v) + '%' } };
  const ch = (k) => first && first[k] ? ((last[k] - first[k]) / first[k] * 100) : 0;
  const topGoal = [...stats.goalStats].sort((a, b) => b.paid - a.paid)[0];
  const phys = pct(stats.prevDone('physical'), stats.active.length), dent = pct(stats.prevDone('dental'), stats.active.length), blood = pct(stats.prevDone('bloodwork'), stats.active.length);
  const C = ({ children }) => <span className="inline-block px-1.5 rounded-md bg-bg2 text-ink">{children}</span>;
  const insights = [
    { icon: 'arrowUpR', title: 'Adoption', body: <><C>{stats.connected.length} of {stats.active.length}</C> people have a device connected ({Math.round(stats.connectionRate * 100)}%). Typical employer wellness programs see about a third of people engage.</> },
    { icon: ch('sleep') >= 0 ? 'arrowUpR' : 'arrowDownR', title: 'Sleep and recovery', body: <>Average <C>sleep</C> is {last ? last.sleep.toFixed(1) : '—'}h, {Math.abs(ch('sleep')).toFixed(1)}% {ch('sleep') >= 0 ? 'up' : 'down'} over 8 weeks. Average <C>HRV</C> is {last ? Math.round(last.hrv) : '—'} ms, {ch('hrv') >= 0 ? 'up' : 'down'} {Math.abs(ch('hrv')).toFixed(1)}%.</> },
    { icon: 'spark', title: 'Rewards', body: <><C>{fmtMoney(stats.bonuses)}</C> paid this month across {stats.earning} people. {topGoal ? <><C>{topGoal.short}</C> drove {pct(topGoal.paid, Math.max(1, stats.bonuses))}% of it.</> : null}</> },
    { icon: 'shield', title: 'Preventive care', body: <><C>{phys}%</C> completed an annual physical, {dent}% a dental checkup, {blood}% a bloodwork panel. {blood < 40 ? 'Bloodwork is the easiest lift: it is covered and most people do not know.' : ''}</> },
  ];
  return <><ErTitle title="Insights" right={<><Button size="sm" variant="secondary" icon={I.book(14)} onClick={() => navigate('/employer/report/board')}>Board report</Button><Button size="sm" variant="secondary" icon={I.download(14)} onClick={() => exportTeamCsv(company, stats)}>Export</Button></>} />
    {stats.connected.length < 5 ? <Card><Empty icon="lock" title="Insights unlock at 5 connected people" body="Pulse never shows team data for groups smaller than 5, so no one can be singled out." /></Card> : <>
      <div className="grid grid-cols-2 md:grid-cols-4 gap-5 md:gap-8 py-2">{[['Program score', ps.score], ['Adoption', Math.round(stats.connectionRate * 100) + '%'], ['Rewards paid', fmtMoney(stats.bonuses)], ['Est. ROI', roi.multiple + 'x']].map(([l, v], i) => <div key={l}><div className="text-[14px] text-ink2 inline-block border-b border-dotted border-ink3">{l}</div><div className={cx('text-ink tabular mt-1', i === 0 ? 'text-[44px]' : 'text-[30px] md:mt-3')} style={{ fontWeight: 400 }}>{v}</div></div>)}</div>
      <div className="grid lg:grid-cols-12 gap-8 mt-8">
        <div className="lg:col-span-5 space-y-7">{insights.map(x => <div key={x.title} className="flex gap-3"><span className="text-ink mt-1">{I[x.icon](15)}</span><div><div className="text-[15.5px] text-ink font-medium">{x.title}</div><p className="text-[14.5px] text-ink2 mt-1 leading-relaxed">{x.body}</p></div></div>)}</div>
        <div className="lg:col-span-7"><div className="flex justify-end mb-3"><Segmented label="Metric" value={metric} onChange={setMetric} options={[{ value: 'sleep', label: 'Sleep' }, { value: 'hrv', label: 'HRV' }, { value: 'exercise', label: 'Activity' }, { value: 'adoption', label: 'Adoption' }]} /></div><AreaChart data={S[metric].data} labels={metric === 'adoption' ? stats.months.map(m => m.label) : W.map(w => w.label)} fmt={S[metric].fmt} height={300} /></div>
      </div>
      <p className="text-[12.5px] text-ink3 mt-6">Trends are generated from synthetic demo data and may include inaccuracies.</p>
      <div className="h-px bg-line my-10" />
      <div className="grid lg:grid-cols-3 gap-5">
        <Card className="p-6 lg:col-span-2"><div className="flex items-center justify-between"><a href="#/employer/signal" className="text-[17px] text-ink hover:underline inline-flex items-center gap-1">Team health signal {I.chevR(14)}</a><StatusPill status={stats.flagged.length >= 3 ? 'watch' : 'optimal'}>{stats.flagged.length >= 3 ? 'Active' : 'Steady'}</StatusPill></div><p className="text-[14px] text-ink2 mt-2 leading-relaxed">{stats.flagged.length >= 3 ? <><b className="text-ink font-medium">{stats.flagged.length} people ({pct(stats.flagged.length, stats.connected.length)}% of connected)</b> show a simultaneous 3-week decline in sleep, HRV and movement. This pattern tends to show up 4 to 8 weeks before burnout. Pulse does not tell you who.</> : 'No team-level decline. Pulse checks every night and will flag it here and in Needs you.'}</p>
          <div className="mt-5"><AreaChart data={W.map(w => +w.hrv.toFixed(1))} labels={W.map(w => w.label)} fmt={v => v.toFixed(0) + ' ms'} height={170} color={stats.flagged.length >= 3 ? 'var(--watch)' : 'var(--data)'} /></div>
          <div className="flex flex-wrap gap-2 mt-4">{company.recoveryWeek ? <Button variant="secondary" size="sm" onClick={() => { setRecovery(company, false); toast('Recovery week ended'); }}>End recovery week</Button> : <Button size="sm" onClick={() => { setRecovery(company, true); toast('Recovery week on'); }}>Turn on recovery week</Button>}<Button size="sm" variant="secondary" onClick={() => { db.log('wellness_day', company.id, {}); toast('Wellness day announced'); }}>Announce a wellness day</Button></div></Card>
        <Card className="p-6"><div className="text-[17px] text-ink">Goal performance</div><div className="mt-3 divide-line">{stats.goalStats.map(g => <div key={g.id} className="py-3"><div className="flex justify-between text-[14px]"><span className="text-ink">{g.short}</span><span className="text-ink2 tabular">{pct(g.met, g.enrolled)}% met</span></div><div className="mt-1.5"><Progress value={pct(g.met, g.enrolled)} color="var(--data)" h={4} /></div><div className="text-[12px] text-ink3 mt-1">{g.enrolled} enrolled · {fmtMoney(g.paid)} paid</div></div>)}</div></Card>
      </div>
      <RetentionSection />
    </>}</>;
}

/* ─── SETTINGS ─── */
function ErSettings() {
  const { company, user } = useEr(); const toast = useToast(); const [f, setF] = useState({ name: company.name, location: company.location || '', size: company.size || '' }); const prefs = companyPrefs(company); const [theme, toggle] = useTheme();

/* ─── ONBOARDING (employer) ─── */
function EmployerOnboarding({ user, company }) {
  const [step, setStep] = useState(0); const [pri, setPri] = useState(['retention', 'burnout']); const [plan, setPlan] = useState(company.plan); const [inc, setInc] = useState(company.incentives); const [payroll, setPayroll] = useState(null); const [f, setF] = useState({ industry: '', size: '10-50', location: '' }); const [turn, setTurn] = useState(18);
  const steps = ['Company', 'Priorities', 'Budget', 'Rewards', 'Payroll'];
  const finish = () => { db.update('companies', company.id, { ...f, baseline: { turnover: (+turn || 0) / 100 }, retentionDays: 30, plan, incentives: inc, onboarded: true, prefs: { ...companyPrefs(company), priorities: pri }, payroll: payroll ? { provider: payroll, connected: true, lastSync: nowLocal(), pendingHires: [] } : company.payroll }); db.log('company_onboarded', company.id, {}); const c2 = db.find('companies', c => c.id === company.id); if (payroll) syncPayroll(c2); fireConfetti(); navigate('/employer'); };
  const next = () => step < steps.length - 1 ? setStep(step + 1) : finish(); const comp = complianceFor(inc);
  const Opt = ({ on, onClick, title, sub }) => <button onClick={onClick} aria-pressed={on} className="w-full text-left p-4 rounded-2xl border-[1.5px] transition focus-ring" style={{ borderColor: on ? 'var(--ink)' : 'var(--line)', background: on ? 'var(--surface)' : 'transparent' }}><div className="text-[14.5px] text-ink font-medium">{title}</div>{sub && <div className="text-[12.5px] text-ink3">{sub}</div>}</button>;
  const body = [
    <><h1 className="text-[32px] text-ink tight" style={{ fontWeight: 450 }}>Tell us about {company.name}</h1><div className="space-y-4 mt-6"><Input label="Industry" value={f.industry} onChange={e => setF({ ...f, industry: e.target.value })} placeholder="B2B SaaS" /><Select label="Team size" value={f.size} onChange={e => setF({ ...f, size: e.target.value })}>{['1-10', '10-50', '50-200', '200+'].map(s => <option key={s}>{s}</option>)}</Select><Input label="Location" value={f.location} onChange={e => setF({ ...f, location: e.target.value })} placeholder="San Francisco, CA" /><Input label="Roughly what % of your team left in the last 12 months?" type="number" min="0" max="100" value={turn} onChange={e => setTurn(e.target.value)} hint="Your baseline, so Pulse can show whether retention improves." /></div></>,
    <><h1 className="text-[32px] text-ink tight" style={{ fontWeight: 450 }}>What matters most?</h1><p className="text-[15px] text-ink2 mt-1">Pulse shapes your home screen and weekly digest around this.</p><div className="grid sm:grid-cols-2 gap-3 mt-6">{EMPLOYER_PRIORITIES.map(o => <Opt key={o.id} on={pri.includes(o.id)} onClick={() => setPri(pri.includes(o.id) ? pri.filter(x => x !== o.id) : [...pri, o.id])} title={o.label} sub={o.sub} />)}</div></>,
    <><h1 className="text-[32px] text-ink tight" style={{ fontWeight: 450 }}>Set your budget</h1><p className="text-[15px] text-ink2 mt-1">Fixed per person. No renewal shock.</p><div className="space-y-6 mt-6">{[['ichraMonthly', 'Premium allowance', 200, 900], ['walletMonthly', 'Wellness wallet', 0, 400]].map(([k, l, mi, ma]) => <div key={k}><div className="flex justify-between"><span className="text-[14.5px] text-ink">{l}</span><span className="text-[20px] text-ink tabular">{fmtMoney(plan[k])}<span className="text-[12px] text-ink3">/mo</span></span></div><input type="range" min={mi} max={ma} step={25} value={plan[k]} onChange={e => setPlan({ ...plan, [k]: +e.target.value })} className="range mt-3" aria-label={l} /></div>)}</div></>,
    <><h1 className="text-[32px] text-ink tight" style={{ fontWeight: 450 }}>Turn on rewards</h1><p className="text-[15px] text-ink2 mt-1">Auto-verified. HIPAA 30% check: <span style={{ color: comp.ok ? 'var(--good)' : 'var(--bad)' }}>{(comp.ratio * 100).toFixed(1)}%</span></p><div className="space-y-2 mt-6">{GOAL_CATALOG.map(g => { const c = inc.goals.find(x => x.id === g.id); return <div key={g.id} className="flex items-center gap-3 p-3.5 rounded-2xl border border-line"><IconTile n={GOAL_ICON[g.id]} size={34} /><div className="flex-1 text-[14px] text-ink">{g.name}</div><span className="tabular text-[13.5px] text-ink2">{fmtMoney(c.amount)}</span><Toggle on={c.enabled} onChange={() => setInc({ ...inc, goals: inc.goals.map(x => x.id === g.id ? { ...x, enabled: !x.enabled } : x) })} label={g.name} /></div>; })}</div></>,
    <><h1 className="text-[32px] text-ink tight" style={{ fontWeight: 450 }}>Connect payroll</h1><p className="text-[15px] text-ink2 mt-1">Pulse invites your team and keeps it in sync. You can also invite by email later.</p><div className="grid sm:grid-cols-2 gap-3 mt-6">{['Gusto', 'Rippling', 'Justworks', 'Deel'].map(p => <Opt key={p} on={payroll === p} onClick={() => setPayroll(payroll === p ? null : p)} title={p} sub={payroll === p ? 'Will connect and invite new hires' : 'Connect'} />)}</div></>,
  ][step];
  return <div className="min-h-screen bg-bg flex flex-col"><header className="max-w-xl w-full mx-auto px-6 h-20 flex items-center justify-between"><Logo mono /><span className="label">Step {step + 1} of {steps.length}</span></header><div className="max-w-xl w-full mx-auto px-6"><div className="flex gap-1.5">{steps.map((_, i) => <div key={i} className="flex-1 h-1 rounded-full" style={{ background: i <= step ? 'var(--data)' : 'var(--line)' }} />)}</div></div>
    <main className="flex-1 max-w-xl w-full mx-auto px-6 py-10 fade-in" key={step}>{body}</main>
    <footer className="max-w-xl w-full mx-auto px-6 pb-10 flex items-center justify-between">{step > 0 ? <Button variant="ghost" onClick={() => setStep(step - 1)} icon={I.chevL(15)}>Back</Button> : <span />}<Button size="lg" disabled={step === 3 && !comp.ok} onClick={next} style={{ background: 'var(--data)', color: '#fff' }} iconRight={I.arrowR(16)}>{step === steps.length - 1 ? (payroll ? 'Connect and finish' : 'Finish') : 'Continue'}</Button></footer></div>;
}

function DualLine({ a, b, labels, height = 220, fmt = v => v.toFixed(1), ca = 'var(--watch)', cb = 'var(--data)' }) {
  const ref = useRef(); const [w, setW] = useState(640);
  useEffect(() => { if (!ref.current) return; const ro = new ResizeObserver(e => setW(e[0].contentRect.width)); ro.observe(ref.current); return () => ro.disconnect(); }, []);
  const all = [...a, ...b].filter(v => isFinite(v)); if (!all.length) return <div ref={ref} style={{ height }} />;
  const max = Math.max(...all), min = Math.min(...all), pad = (max - min) * 0.25 || 1; const L = 46;
  const y = v => height - 26 - ((v - (min - pad)) / ((max + pad) - (min - pad))) * (height - 40); const x = i => L + i / Math.max(1, a.length - 1) * (w - L - 10);
  const path = arr => arr.map((v, i) => (i ? 'L' : 'M') + x(i).toFixed(1) + ' ' + y(v).toFixed(1)).join(' ');
  return <div ref={ref}><svg width={w} height={height} aria-hidden="true">{[min, (min + max) / 2, max].map((t, i) => <g key={i}><line x1={L} x2={w - 10} y1={y(t)} y2={y(t)} stroke="var(--line)" strokeDasharray="1 5" strokeWidth="1.5" strokeLinecap="round" /><text x={L - 8} y={y(t) + 3.5} textAnchor="end" fontSize="10.5" style={{ fill: 'var(--ink3)' }}>{fmt(t)}</text></g>)}
    <path d={path(b)} fill="none" stroke={cb} strokeWidth="1.8" opacity=".7" /><path d={path(a)} fill="none" stroke={ca} strokeWidth="2.2" />{a.map((v, i) => <circle key={i} cx={x(i)} cy={y(v)} r={i === a.length - 1 ? 4 : 2.5} fill={ca} />)}
    {labels.map((l, i) => (i % 2 === 0 || i === labels.length - 1) && <text key={i} x={x(i)} y={height - 6} textAnchor={i === 0 ? 'start' : i === labels.length - 1 ? 'end' : 'middle'} fontSize="11" style={{ fill: 'var(--ink3)' }}>{l}</text>)}</svg></div>;
}

/* ─── Recommendations (data feeds plan design) ─── */
function RecommendationsCard({ limit = 10, compact }) {
  const { company, stats } = useEr(); const toast = useToast(); const recs = recommendations(company, stats).slice(0, limit); if (!recs.length) return null;
  return <Card className={cx('p-6', compact ? '' : 'mb-6')}><div className="flex items-center justify-between"><div className="text-[17px] text-ink flex items-center gap-2"><span className="text-accent">{I.spark(16)}</span>Pulse suggests</div>{compact && <a href="#/employer/program" className="text-[13px] text-data inline-flex items-center gap-0.5 whitespace-nowrap">All {I.chevR(12)}</a>}</div><div className="text-[13px] text-ink3">Based on this month’s data. One click applies it.</div>
    <div className="mt-3 divide-line">{recs.map(r => <div key={r.key} className="flex flex-col sm:flex-row sm:items-center gap-3 py-4"><IconTile n={r.icon} size={36} tone="accent" /><div className="flex-1"><div className="text-[14.5px] text-ink">{r.title}</div><div className="text-[13px] text-ink3 leading-snug">{r.body}</div></div><div className="flex gap-2 flex-shrink-0"><Button size="sm" variant="ghost" onClick={() => decide(r.key, 'dismissed', company.id)}>Dismiss</Button><Button size="sm" onClick={() => { const m = r.apply(); decide(r.key, 'applied', company.id); audit(company.id, adminName(company), 'Applied a recommendation', null, r.title); toast(m); }}>{r.cta}</Button></div></div>)}</div></Card>;
}
function GuaranteeCard() {
  const { company, stats } = useEr(); const g = guarantee(company, stats);
  return <Card className="p-6"><div className="flex items-center justify-between"><div className="text-[15px] text-ink2">Participation guarantee</div><StatusPill status={g.onTrack ? 'optimal' : 'watch'}>{g.onTrack ? 'On track' : 'At risk'}</StatusPill></div><div className="text-[30px] text-ink tabular mt-1" style={{ fontWeight: 400 }}>{Math.round(g.rate * 100)}%</div><div className="text-[13px] text-ink3">connected · month {g.months} of 6</div>
    <div className="relative mt-4 h-2.5 rounded-full bg-bg2"><div className="absolute inset-y-0 left-0 rounded-full" style={{ width: Math.min(100, g.rate * 100) + '%', background: g.onTrack ? 'var(--good)' : 'var(--watch)' }} /><div className="absolute -top-1 -bottom-1 w-[2px] bg-ink" style={{ left: '50%' }} /></div><div className="text-[11.5px] text-ink3 mt-1.5" style={{ marginLeft: 'calc(50% - 20px)' }}>50% floor</div>
    <p className="text-[12.5px] text-ink3 mt-2 leading-relaxed">If fewer than half your team is connected at month 6, you don’t pay Pulse for those months.</p></Card>;
}
function AuditLogCard() {
  const { company } = useEr(); const rows = db.where('audit', a => a.companyId === company.id).sort((a, b) => b.at.localeCompare(a.at)).slice(0, 25); const name = id => id ? ((db.find('employees', e => e.id === id) || {}).name || 'Former employee') : null;
  return <Card className="p-6 lg:col-span-2"><div className="text-[17px] text-ink">Audit log</div><div className="text-[13px] text-ink3">Every time anyone looks at or changes health-related data. Employees see entries about themselves.</div><div className="mt-3 divide-line max-h-80 overflow-y-auto scroll-thin">{rows.map(a => <div key={a.id} className="grid grid-cols-12 gap-3 py-2.5 text-[13px]"><span className="col-span-3 text-ink3">{new Date(a.at).toLocaleString('en-US', { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' })}</span><span className="col-span-3 text-ink truncate">{a.actor}</span><span className="col-span-6 text-ink2">{a.action}{name(a.subjectId) ? ` · ${name(a.subjectId)}` : ''}{a.detail ? ` · ${a.detail}` : ''}</span></div>)}{!rows.length && <div className="py-6 text-center text-[13px] text-ink3">Nothing yet.</div>}</div></Card>;
}
/* ─── Challenges (employer) ─── */
function ChallengesTab() {
  const { company, stats } = useEr(); const toast = useToast(); const list = db.where('challenges', c => c.companyId === company.id).sort((a, b) => b.start.localeCompare(a.start)); const act = activeChallenge(company);
  const [f, setF] = useState({ name: 'Step it up', metric: 'steps', weeks: 2, prize: '$25 wallet top-up for the winning team' });
  const board = act ? challengeBoard(act, stats) : null;
  return <div className="grid lg:grid-cols-3 gap-5"><div className="lg:col-span-2 space-y-5">{act ? <Card className="p-6"><div className="flex justify-between"><div><div className="text-[17px] text-ink">{act.name}</div><div className="text-[13px] text-ink3">{board.m.label} · {fmtDate(act.start)} to {fmtDate(act.end)} · {board.participants} people opted in</div></div><Button size="sm" variant="ghost" onClick={() => { db.update('challenges', act.id, { end: iso(addDays(today(), -1)) }); toast('Challenge ended'); }}>End early</Button></div>
      <div className="mt-4 divide-line">{board.rows.map((r, i) => <div key={r.team} className="flex items-center gap-4 py-3"><span className="mono text-[12px] text-ink3 w-5">{r.value != null ? i + 1 : '–'}</span><span className="flex-1 text-[14.5px] text-ink">{r.team}</span><span className="text-[13px] text-ink3">{r.n} in</span><span className="tabular text-[14.5px] text-ink w-24 text-right">{r.value != null ? board.m.fmt(r.value) : <span className="text-[12px] text-ink3">needs 5</span>}</span></div>)}</div><p className="text-[12px] text-ink3 mt-3">Team averages only, shown once a team has 5 people in. You never see who joined.</p></Card> : <Card><Empty icon="users" title="No challenge running" body="Challenges keep engagement up after the novelty of rewards wears off. Team averages only." /></Card>}
    {list.filter(c => c !== act).length > 0 && <Card className="divide-line">{list.filter(c => c !== act).map(c => <div key={c.id} className="flex justify-between px-6 py-3 text-[14px]"><span className="text-ink">{c.name}</span><span className="text-ink3">{fmtDate(c.start)} to {fmtDate(c.end)}</span></div>)}</Card>}</div>
    <Card className="p-6 h-fit"><div className="text-[17px] text-ink mb-4">Start a challenge</div><div className="space-y-4"><Input label="Name" value={f.name} onChange={e => setF({ ...f, name: e.target.value })} /><Select label="Measure" value={f.metric} onChange={e => setF({ ...f, metric: e.target.value })}>{Object.entries(CHALLENGE_METRICS).map(([k, m]) => <option key={k} value={k}>{m.label}</option>)}</Select><Select label="Length" value={f.weeks} onChange={e => setF({ ...f, weeks: +e.target.value })}>{[1, 2, 4].map(w => <option key={w} value={w}>{plural(w, 'week')}</option>)}</Select><Input label="Prize" value={f.prize} onChange={e => setF({ ...f, prize: e.target.value })} /><Button className="w-full" onClick={() => { if (act) db.update('challenges', act.id, { end: iso(addDays(today(), -1)) }); db.insert('challenges', { id: 'ch_' + uid(), companyId: company.id, name: f.name, metric: f.metric, start: iso(today()), end: iso(addDays(today(), f.weeks * 7 - 1)), prize: f.prize, createdAt: iso(today()) }); toast('Challenge started. Everyone can opt in from Today.'); }}>Start challenge</Button></div></Card></div>;
}


/* ═══════════════════════════════════════════════════════════════════════
   APP
   ═══════════════════════════════════════════════════════════════════════ */
function App() {
  const route = useRoute(); const { user, company, employee } = useAuth();
  useEffect(() => { document.title = user ? (user.role === 'employer' ? `${company ? company.name : 'Pulse'} · Pulse` : 'Pulse') : 'Pulse · Health benefits that know you'; }, [user && user.id, route]);
  if (route === '/login') return <Login />;
  if (route === '/signup') return <Signup />;
  if (route.startsWith('/join')) return <Join />;
  if (!user || !company) { if (route.startsWith('/me') || route.startsWith('/employer')) { setTimeout(() => navigate('/login'), 0); return null; } return <Landing />; }
  if (user.role === 'employer') { if (!route.startsWith('/employer')) { setTimeout(() => navigate('/employer'), 0); return null; } return <EmployerApp user={user} company={company} route={route} />; }
  if (!employee) return <Landing />;
  if (!route.startsWith('/me')) { setTimeout(() => navigate('/me'), 0); return null; }
  return <EmployeeApp user={user} company={company} employee={employee} route={route} />;
}
class ErrorBoundary extends React.Component {
  constructor(p) { super(p); this.state = { err: null }; }
  static getDerivedStateFromError(err) { return { err }; }
  componentDidCatch(err, info) { console.error('Pulse error', err, info); }
  render() { if (this.state.err) return <div className="min-h-screen flex items-center justify-center p-8 bg-bg"><div className="card p-8 max-w-md text-center"><div className="serif text-[28px] text-ink">Something broke</div><p className="text-[14px] text-ink2 mt-2">{String(this.state.err.message || this.state.err)}</p><div className="flex justify-center gap-2 mt-5"><Button variant="secondary" onClick={() => { this.setState({ err: null }); navigate('/'); }}>Go home</Button><Button onClick={() => { seedDemo(); this.setState({ err: null }); navigate('/'); }}>Reset demo</Button></div></div></div>; return this.props.children; }
}
migrate();
ReactDOM.createRoot(document.getElementById('root')).render(<ErrorBoundary><ToastProvider><App /></ToastProvider></ErrorBoundary>);

</script>
</body>
</html>
